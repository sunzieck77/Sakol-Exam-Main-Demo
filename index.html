<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>ระบบจัดการสอบ - โรงเรียนสกลวิทยา</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F52746',
                        'primary-dark': '#d41f3a',
                        'primary-light': '#f85a73',
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    fontSize: {
                        'xxs': '10px',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SheetJS (XLSX Parsing Library) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; color: #111827; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border-top-color: #F52746; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Skeleton Animation */
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Custom Scrollbar for tables */
        .table-container::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-sm md:text-base">

    <!-- Navbar -->
    <nav class="glass-header sticky top-0 z-50 border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="app.navigate('home')">
                    <img class="h-10 w-auto rounded-md shadow-sm" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVcb4_iotfwEJf9W6CNhIqY-MJkwz0NC6xH8PiXoy2qQuBQoszEcMZpnE&s=10" alt="โรงเรียนสกลวิทยา">
                    <div class="ml-3 flex flex-col">
                        <span class="font-bold text-lg leading-tight text-gray-900">โรงเรียนสกลวิทยา</span>
                        <span class="text-xs text-primary font-semibold">ระบบจัดการสอบ</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="navAdminBtn" class="p-2 text-gray-500 hover:text-primary transition-colors rounded-full hover:bg-red-50" onclick="app.promptAdminLogin()">
                        <i class="ph ph-gear text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Top Navigation Bar (Back Button & Breadcrumbs) -->
    <div id="topNavContainer" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 hidden flex-col sm:flex-row sm:items-center gap-3 md:gap-4">
        <button id="globalBackBtn" onclick="app.goBack()" class="flex items-center justify-center text-sm text-gray-700 hover:text-primary transition bg-white border border-gray-300 px-3 py-1.5 rounded-lg shadow-sm hover:bg-gray-50">
            <i class="ph ph-arrow-left mr-1.5 text-lg"></i> ย้อนกลับ
        </button>
        <nav class="flex text-xs md:text-sm text-gray-500 font-medium overflow-x-auto hide-scroll" aria-label="Breadcrumb" id="breadcrumbList">
            <!-- Dynamic Breadcrumbs -->
        </nav>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-24" id="mainContent">
        <!-- Content will be injected here -->
    </main>

    <!-- Global Modals Container -->
    <div id="modalContainer"></div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCG5jdaYdcKeAe0yVBB-IOcPaWqMF6Ioa4",
            authDomain: "sakol-exam-demo.firebaseapp.com",
            databaseURL: "https://sakol-exam-demo-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sakol-exam-demo",
            storageBucket: "sakol-exam-demo.firebasestorage.app",
            messagingSenderId: "762406440249",
            appId: "1:762406440249:web:a2aef8217dcd31094dece8"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getDatabase(firebaseApp);

        // ==========================================
        // SYSTEM CORE & STATE MANAGEMENT
        // ==========================================
        window.app = {
            db: db,
            state: {
                isAdmin: false,
                currentView: 'home',
                currentTermId: null,      
                currentTermName: null,    
                breadcrumbs: [{ label: 'หน้าแรก', view: 'home' }],
                history: [], 
                cache: { teachers: null, classes: null, terms: null }, 
                pagination: { page: 1, limit: 12 },
                tempData: {}, 
                searchQuery: "", 
                statusFilter: "all", 
                searchTimeout: null 
            },

            // --- Utilities ---
            toast: Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
                timerProgressBar: true, didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            }),

            showLoading: () => {
                Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, showConfirmButton: false, 
                    willOpen: () => { Swal.showLoading(); } 
                });
            },
            hideLoading: () => { Swal.close(); },

            checkPwd: (p) => p === atob('c2tleGFt'),

            // --- Initializer for Term (Migration script) ---
            initSystem: async () => {
                const termsSnap = await get(child(ref(db), 'terms'));
                let defaultTermId = null;
                const updates = {};

                // 1. ตรวจสอบและสร้าง/หา เทอมปัจจุบัน
                if (!termsSnap.exists()) {
                    console.log("Initializing default term...");
                    const newTermRef = push(ref(db, 'terms'));
                    defaultTermId = newTermRef.key;
                    updates[`terms/${defaultTermId}`] = { 
                        name: "เทอม 1 ปีการศึกษา 2569", 
                        timestamp: Date.now(),
                        isCurrent: true // เซ็ตสถานะเป็นปัจจุบัน
                    };
                } else {
                    const terms = termsSnap.val();
                    // หาเทอมที่ถูกตั้งเป็น isCurrent หรือถ้าไม่มีให้เอาเทอมแรกสุด
                    const currentTermKey = Object.keys(terms).find(k => terms[k].isCurrent);
                    if (currentTermKey) {
                        defaultTermId = currentTermKey;
                    } else {
                        defaultTermId = Object.keys(terms)[0];
                        updates[`terms/${defaultTermId}/isCurrent`] = true; // บังคับให้เทอมแรกเป็นปัจจุบัน
                    }
                }

                // 2. ดึงข้อมูลทั้งหมดมาตรวจสอบว่าขาด termId หรือไม่ (เพื่อ Migrate ข้อมูลเก่า)
                const [examsSnap, schedSnap, classesSnap, historySnap] = await Promise.all([
                    get(child(ref(db), 'exams')),
                    get(child(ref(db), 'schedules')),
                    get(child(ref(db), 'classes')),
                    get(child(ref(db), 'history'))
                ]);

                if (examsSnap.exists()) {
                    const exams = examsSnap.val();
                    Object.keys(exams).forEach(eId => { if (!exams[eId].termId) updates[`exams/${eId}/termId`] = defaultTermId; });
                }
                if (schedSnap.exists()) {
                    const scheds = schedSnap.val();
                    Object.keys(scheds).forEach(sId => { if (!scheds[sId].termId) updates[`schedules/${sId}/termId`] = defaultTermId; });
                }
                if (classesSnap.exists()) {
                    const classes = classesSnap.val();
                    Object.keys(classes).forEach(cId => { if (!classes[cId].termId) updates[`classes/${cId}/termId`] = defaultTermId; });
                }
                if (historySnap.exists()) {
                    const historyRecords = historySnap.val();
                    Object.keys(historyRecords).forEach(hId => { if (!historyRecords[hId].termId) updates[`history/${hId}/termId`] = defaultTermId; });
                }

                // หากมีข้อมูลเก่าที่ต้องเชื่อมโยง ให้ทำการสั่งอัปเดตลง Database
                if (Object.keys(updates).length > 0) {
                    console.log("Migrating old data to link with current term...", defaultTermId);
                    await update(ref(db), updates);
                }
            },

            // --- Database Helpers ---
            api: {
                get: async (path, force = false) => {
                    if (!force && app.state.cache[path]) return app.state.cache[path];
                    try {
                        const snapshot = await get(child(ref(db), path));
                        const data = snapshot.exists() ? snapshot.val() : null;
                        if(['teachers', 'classes', 'terms'].includes(path)) app.state.cache[path] = data;
                        return data;
                    } catch (e) {
                        console.error(e);
                        app.toast.fire({ icon: 'error', title: 'เกิดข้อผิดพลาดในการดึงข้อมูล' });
                        return null;
                    }
                },
                set: async (path, data) => {
                    try { await set(ref(db, path), data); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                update: async (updates) => {
                    try { await update(ref(db), updates); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                remove: async (path) => {
                    try { await remove(ref(db, path)); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                push: async (path, data) => {
                    try { 
                        const newRef = push(ref(db, path));
                        await set(newRef, data); 
                        return newRef.key;
                    } catch (e) { console.error(e); return null; }
                },
                logAction: async (action, details, refId = "", extraData = null) => {
                    if(!app.state.isAdmin) return;
                    await app.api.push('history', {
                        action, details, refId, extraData, 
                        termId: app.state.currentTermId, 
                        timestamp: Date.now()
                    });
                }
            },

            handleSearch: (val, actionObj) => {
                app.state.searchQuery = val;
                app.state.pagination.page = 1;
                
                clearTimeout(app.state.searchTimeout);
                app.state.searchTimeout = setTimeout(() => {
                    if (actionObj.type === 'renderView') app.renderView(true);
                    else if (actionObj.type === 'loadAdminTab') app.loadAdminTab(actionObj.tab, true);
                }, 400); 
            },

            // --- Navigation & Rendering ---
            navigate: (view, params = {}, isBack = false) => {
                if (!isBack && app.state.currentView && app.state.currentView !== view) {
                    app.state.history.push({
                        view: app.state.currentView,
                        params: JSON.parse(JSON.stringify(app.state.tempData)),
                        searchQuery: app.state.searchQuery,
                        statusFilter: app.state.statusFilter,
                        page: app.state.pagination.page
                    });
                }

                app.state.currentView = view;
                app.state.tempData = params;
                
                if (!isBack) {
                    app.state.pagination.page = 1;
                    app.state.searchQuery = "";
                    app.state.statusFilter = "all";
                }
                
                const tnc = document.getElementById('topNavContainer');
                if (view === 'home') {
                    app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }];
                    tnc.classList.add('hidden'); tnc.classList.remove('flex');
                    app.state.history = []; 
                    app.state.currentTermId = null;
                    app.state.currentTermName = null;
                } else {
                    tnc.classList.remove('hidden'); tnc.classList.add('flex');
                    
                    if(view === 'public-terms') {
                        app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }, { label: 'เลือกปีการศึกษา', view: 'public-terms' }];
                    }
                    if(view === 'public-teachers') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' },
                            { label: 'เลือกปีการศึกษา', view: 'public-terms' }, 
                            { label: `รายชื่อครู (${app.state.currentTermName})`, view: 'public-teachers' }
                        ];
                    }
                    if(view === 'public-exams') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'เลือกปีการศึกษา', view: 'public-terms' },
                            { label: 'รายชื่อครูผู้สอน', view: 'public-teachers' }, 
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'public-exams', params: params }
                        ];
                    }
                    if(view === 'public-exam-scores') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' },
                            { label: 'เลือกปีการศึกษา', view: 'public-terms' },
                            { label: 'รายชื่อครูผู้สอน', view: 'public-teachers' },
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'public-exams', params: { teacherId: params.teacherId, teacherName: params.teacherName } },
                            { label: params.examSubject, view: 'public-exam-scores', params: params }
                        ];
                    }
                    if(view === 'admin-terms') {
                        app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }, { label: 'เลือกปีการศึกษา (จัดการระบบ)', view: 'admin-terms' }];
                    }
                    if(view === 'admin-dashboard') {
                        app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }, { label: 'เลือกปีการศึกษา', view: 'admin-terms' }, { label: `จัดการระบบ (${app.state.currentTermName})`, view: 'admin-dashboard' }];
                    }
                    if(view === 'admin-teacher-exams') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'admin-teacher-exams', params }
                        ];
                    }
                    if(view === 'admin-manage-scores') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `รายการสอบของ ${params.teacherName || ''}`, view: 'admin-teacher-exams', params: { teacherId: params.teacherId, teacherName: params.teacherName } },
                            { label: `จัดการคะแนน ${params.subjectName}`, view: 'admin-manage-scores', params }
                        ];
                    }
                    if(view === 'admin-class-students') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `นักเรียนชั้น ${params.className}`, view: 'admin-class-students', params }
                        ];
                    }
                }
                app.renderBreadcrumbs();
                app.renderView();
            },

            goBack: () => {
                if (app.state.history.length > 0) {
                    const prev = app.state.history.pop();
                    app.state.searchQuery = prev.searchQuery;
                    app.state.statusFilter = prev.statusFilter;
                    app.state.pagination.page = prev.page || 1;
                    app.navigate(prev.view, prev.params, true);
                } else {
                    app.navigate('home', {}, true);
                }
            },

            renderBreadcrumbs: () => {
                const list = document.getElementById('breadcrumbList');
                list.innerHTML = app.state.breadcrumbs.map((b, i) => {
                    const isLast = i === app.state.breadcrumbs.length - 1;
                    const paramsStr = b.params ? JSON.stringify(b.params).replace(/"/g, '&quot;') : '{}';
                    return `
                        <div class="flex items-center space-x-1.5 whitespace-nowrap">
                            ${i > 0 ? '<i class="ph ph-caret-right text-gray-400"></i>' : ''}
                            <a href="#" onclick="app.navigate('${b.view}', ${paramsStr})" 
                               class="${isLast ? 'text-gray-800 font-semibold cursor-default pointer-events-none' : 'hover:text-primary transition'}">
                               ${b.label}
                            </a>
                        </div>
                    `;
                }).join('');
            },

            renderView: async (skipLoading = false) => {
                let focusData = null;
                if (skipLoading) {
                    const active = document.activeElement;
                    if(active && active.id && active.tagName === 'INPUT') {
                        try { focusData = { id: active.id, start: active.selectionStart, end: active.selectionEnd }; } catch(e){}
                    }
                }

                const container = document.getElementById('mainContent');
                if (!skipLoading) container.innerHTML = app.components.skeletonFull(); 

                const views = {
                    'home': app.views.home,
                    'public-terms': app.views.publicTerms,
                    'public-teachers': app.views.publicTeachers,
                    'public-exams': app.views.publicExams,
                    'public-exam-scores': app.views.publicExamScores,
                    'admin-terms': app.views.adminTerms,
                    'admin-dashboard': app.views.adminDashboard,
                    'admin-teacher-exams': app.views.adminTeacherExams,
                    'admin-manage-scores': app.views.adminManageScores,
                    'admin-class-students': app.views.adminClassStudents
                };

                if (views[app.state.currentView]) {
                    const html = await views[app.state.currentView]();
                    container.innerHTML = html;
                    if(app.state.currentView === 'admin-dashboard') app.initAdminTabs();
                } else {
                    container.innerHTML = `<div class="text-center py-20 text-gray-500">ไม่พบหน้าที่ต้องการ</div>`;
                }
                
                const adminBtn = document.getElementById('navAdminBtn');
                if(app.state.isAdmin) {
                    adminBtn.classList.add('text-primary', 'bg-red-50'); adminBtn.classList.remove('text-gray-500');
                } else {
                    adminBtn.classList.remove('text-primary', 'bg-red-50'); adminBtn.classList.add('text-gray-500');
                }

                if (focusData) {
                    const el = document.getElementById(focusData.id);
                    if (el) {
                        el.focus();
                        try { el.setSelectionRange(focusData.start, focusData.end); } catch(e){}
                    }
                }
            },

            promptAdminLogin: () => {
                if (app.state.isAdmin) {
                    app.navigate('admin-terms');
                    return;
                }
                Swal.fire({
                    title: 'สำหรับผู้ดูแลระบบ',
                    input: 'password',
                    inputPlaceholder: 'กรอกรหัสผ่าน',
                    showCancelButton: true,
                    confirmButtonColor: '#F52746',
                    confirmButtonText: 'เข้าสู่ระบบ',
                    cancelButtonText: 'ยกเลิก'
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (app.checkPwd(result.value)) {
                            app.state.isAdmin = true;
                            app.toast.fire({ icon: 'success', title: 'เข้าสู่ระบบผู้ดูแลสำเร็จ' });
                            app.navigate('admin-terms');
                        } else {
                            Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง', confirmButtonColor: '#F52746' });
                        }
                    }
                });
            },

            paginate: (array) => {
                const start = (app.state.pagination.page - 1) * app.state.pagination.limit;
                return array.slice(start, start + app.state.pagination.limit);
            },
            renderPagination: (totalItems, actionStr = "app.renderView()") => {
                const totalPages = Math.ceil(totalItems / app.state.pagination.limit);
                if (totalPages <= 1) return '';
                const currentPage = app.state.pagination.page;
                let btns = `
                    <button onclick="${currentPage===1 ? '' : `app.state.pagination.page = ${currentPage - 1}; ${actionStr};`}" class="px-3 py-1 border rounded-md text-sm ${currentPage===1 ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'bg-white hover:bg-gray-50'}">ก่อนหน้า</button>
                `;
                for(let i=1; i<=totalPages; i++) {
                    const active = i === currentPage ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 hover:bg-gray-50';
                    btns += `<button onclick="app.state.pagination.page = ${i}; ${actionStr};" class="hidden sm:inline-block px-3 py-1 border rounded-md text-sm ${active}">${i}</button>`;
                }
                btns += `<span class="sm:hidden px-3 py-1 text-sm text-gray-500">หน้า ${currentPage}/${totalPages}</span>`;
                btns += `
                    <button onclick="${currentPage===totalPages ? '' : `app.state.pagination.page = ${currentPage + 1}; ${actionStr};`}" class="px-3 py-1 border rounded-md text-sm ${currentPage===totalPages ? 'text-gray-300 bg-gray-50 cursor-not-allowed' : 'bg-white hover:bg-gray-50'}">ถัดไป</button>
                `;
                return `<div class="flex justify-center items-center space-x-2 mt-6">${btns}</div>`;
            },

            calculateExamStatus: async (examId, classesObj) => {
                const classIds = Object.keys(classesObj || {});
                if(classIds.length === 0) return { text: "ยังไม่ตรวจ", color: "bg-gray-100 text-gray-600 border-gray-200" };

                let gradedCount = 0;
                for(const cid of classIds) {
                    const scoreData = await app.api.get(`scores/${examId}/${cid}`);
                    if(scoreData && scoreData._metadata && Object.keys(scoreData).length > 1) {
                        gradedCount++;
                    }
                }

                if(gradedCount === 0) return { text: "ยังไม่ตรวจ", color: "bg-red-50 text-red-600 border-red-100" };
                else if(gradedCount < classIds.length) return { text: `ตรวจแล้ว ${gradedCount}/${classIds.length} ห้อง`, color: "bg-amber-50 text-amber-600 border-amber-100" };
                else return { text: "ตรวจแล้ว", color: "bg-green-50 text-green-600 border-green-100" };
            }
        };

        // ==========================================
        // UI COMPONENTS & VIEWS
        // ==========================================
        app.components = {
            skeletonFull: () => `

            adminTeacherExams: async () => {
                const { teacherId, teacherName } = app.state.tempData;
                const termId = app.state.currentTermId;
                const [allExams, allSchedules] = await Promise.all([app.api.get('exams'), app.api.get('schedules')]);
                
                let exams = Object.entries(allExams || {})
                            .filter(([id, e]) => e.teacherId === teacherId && e.termId === termId)
                            .map(([id, e]) => ({id, ...e}));
                
                const schedules = Object.values(allSchedules || {}).filter(s => s.termId === termId);
                
                const todayDate = new Date();
                const todayStr = todayDate.getFullYear() + '-' + String(todayDate.getMonth() + 1).padStart(2, '0') + '-' + String(todayDate.getDate()).padStart(2, '0');

                const examTodayTimeMap = {};
                schedules.filter(s => s.date === todayStr).forEach(s => {
                    if (!examTodayTimeMap[s.examId] || s.startTime < examTodayTimeMap[s.examId]) examTodayTimeMap[s.examId] = s.startTime;

        app.loadAdminTab = async (tabName, skipLoading = false) => {
            const container = document.getElementById('adminTabContent');
            let focusData = null;
            if (skipLoading) {
                const active = document.activeElement;
                if(active && active.id && active.tagName === 'INPUT') {
                    try { focusData = { id: active.id, start: active.selectionStart, end: active.selectionEnd }; } catch(e){}
                }
            }

            if (!skipLoading) container.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i></div>`;
            
            if(tabName === 'admin-exams') container.innerHTML = await app.adminTabs.exams();
            if(tabName === 'admin-schedules') container.innerHTML = await app.adminTabs.schedules();
            if(tabName === 'admin-classes') container.innerHTML = await app.adminTabs.classes();
            if(tabName === 'admin-teachers') container.innerHTML = await app.adminTabs.teachers();
            if(tabName === 'admin-history') container.innerHTML = await app.adminTabs.history();

            if (focusData) {
                const el = document.getElementById(focusData.id);
                if (el) {
                    el.focus();
                    try { el.setSelectionRange(focusData.start, focusData.end); } catch(e){}
                }
            }

        app.adminTabs = {
            exams: async () => {
                const termId = app.state.currentTermId;
                const [teachersObj, examsObj, schedulesObj, scoresObj] = await Promise.all([
                    app.api.get('teachers'), app.api.get('exams'), app.api.get('schedules'), app.api.get('scores')
                ]);
                
                let teachers = teachersObj ? Object.entries(teachersObj).map(([id, t]) => ({id, ...t})) : [];
                // Filter Exams by Term

                    teachers = teachers.filter(t => dateTeacherIds.has(t.id));

                const getExamStatusSync = (examId, classesObj) => {
                    const classIds = Object.keys(classesObj || {});
                    if (classIds.length === 0) return "ยังไม่ตรวจ";
                    let gradedCount = 0;
                    for (const cid of classIds) {
                        const scoreData = allScores[examId] ? allScores[examId][cid] : null;
                        if (scoreData && scoreData._metadata && Object.keys(scoreData).length > 1) gradedCount++;
                    }
                    if (gradedCount === 0) return "ยังไม่ตรวจ";
                    else if (gradedCount < classIds.length) return "บางส่วน";
                    else return "ตรวจแล้ว";
                };

                const teacherStats = {};
                for (let t of teachers) {
                    const tExams = exams.filter(e => e.teacherId === t.id);
                    if (tExams.length === 0) {
                        teacherStats[t.id] = { hasExams: false, hasScores: false, allGraded: false };
                        continue;
                    }
                    let anyGraded = false;
                    let allExamsGraded = true;
                    for (let e of tExams) {
                        const statusText = getExamStatusSync(e.id, e.classes);
                        if (statusText !== "ยังไม่ตรวจ") anyGraded = true;
                        if (statusText !== "ตรวจแล้ว") allExamsGraded = false;

                    teacherStats[t.id] = { hasExams: true, hasScores: anyGraded, allGraded: allExamsGraded };

                                ${selectedDate ? `<button onclick="app.state.filterDate = ''; app.state.pagination.page = 1; app.loadAdminTab('admin-exams');" class="text-gray-400 hover:text-red-500 transition ml-2"><i class="ph ph-x-circle text-lg"></i></button>` : ''}

                ]);

                        if (selectedTeacher) searchInput.value = selectedTeacher.name;

            };

        app.ui.renderTeacherListItems = (containerId, hiddenInputId, filteredTeachers) => {

                return;

            listContainer.innerHTML = filteredTeachers.map(t => `

            `).join('');

            const teachers = JSON.parse(container.dataset.teachers || '[]');

            app.ui.renderTeacherListItems(containerId, hiddenInputId, filtered);
            app.ui.showTeacherList(containerId);

        app.actions = {
            // -- Set Current Term Action --
            setCurrentTerm: async (termId) => {
                app.showLoading();
                const termsObj = await app.api.get('terms', true);
                const updates = {};
                if (termsObj) {
                    Object.keys(termsObj).forEach(id => {
                        updates[`terms/${id}/isCurrent`] = (id === termId);
                    });
                    await app.api.update(updates);
                }
                app.state.cache.terms = null;
                app.hideLoading();
                app.toast.fire({ icon: 'success', title: 'ตั้งเป็นปีการศึกษาปัจจุบันสำเร็จ' });
                app.renderView();
            },

            // -- Terms Actions --
            deleteTerm: (termId, name, isCurrent) => {
                if (isCurrent) {
                    return Swal.fire({ 
                        icon: 'error', 
                        title: 'ไม่สามารถลบได้', 
                        text: 'ไม่สามารถลบปีการศึกษาที่เป็น "ปัจจุบัน" ได้ กรุณาตั้งปีการศึกษาอื่นให้เป็นปัจจุบันก่อนทำการลบ',
                        confirmButtonColor: '#F52746'
                    });
                }

                Swal.fire({
                    title: 'ยืนยันการลบปีการศึกษา?',
                    html: `การลบ <span class="font-bold text-red-500">"${name}"</span> จะส่งผลให้ข้อมูลต่อไปนี้ถูกลบทั้งหมดและ <b class="text-red-500">ไม่สามารถกู้คืนได้</b>:<br><br>
                           - ชั้นเรียนและรายชื่อนักเรียนทั้งหมดของเทอมนี้<br>
                           - รายการวิชาสอบในเทอมนี้<br>
                           - ข้อมูลตารางสอบในเทอมนี้<br>
                           - คะแนนสอบของนักเรียนทุกคนในเทอมนี้`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'รับทราบและลบข้อมูล',
                    cancelButtonText: 'ยกเลิก'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        app.showLoading();
                        const updates = {};
                        
                        // 1. ลบเทอม
                        updates[`terms/${termId}`] = null;
                        
                        // 2. ลบ Exams และ Scores
                        const examsObj = await app.api.get('exams');
                        if (examsObj) {
                            for (const [eId, e] of Object.entries(examsObj)) {
                                if (e.termId === termId) {
                                    updates[`exams/${eId}`] = null;
                                    if(e.classes) {
                                        Object.keys(e.classes).forEach(cid => {
                                            updates[`scores/${eId}/${cid}`] = null;
                                        });
                                    }
                                }
                            }
                        }

                        // 3. ลบ Schedules
                        const schedObj = await app.api.get('schedules');
                        if (schedObj) {
                            Object.entries(schedObj).forEach(([sId, s]) => {
                                if (s.termId === termId) updates[`schedules/${sId}`] = null;
                            });
                        }

                        // 4. ลบ Classes & Students
                        const classesObj = await app.api.get('classes');
                        if (classesObj) {
                            Object.entries(classesObj).forEach(([cId, c]) => {
                                if (c.termId === termId) {
                                    updates[`classes/${cId}`] = null;
                                    updates[`students/${cId}`] = null;
                                }
                            });
                        }
                        
                        // 5. ลบ History
                        const historyObj = await app.api.get('history');
                        if (historyObj) {
                            Object.entries(historyObj).forEach(([hId, h]) => {
                                if (h.termId === termId) {
                                    updates[`history/${hId}`] = null;
                                }
                            });
                        }

                        if (Object.keys(updates).length > 0) {
                            await app.api.update(updates);
                        }

                        app.state.cache.terms = null; 
                        app.state.cache.classes = null;
                        app.hideLoading();
                        app.toast.fire({ icon: 'success', title: 'ลบปีการศึกษาเรียบร้อย' });
                        app.renderView(); 
                    }
                });
            },

            // -- Copy Classes from another Term --
            copyClassesFromTerm: async (sourceTermId) => {
                if (!sourceTermId) return;
                
                app.showLoading();
                const classesObj = await app.api.get('classes', true); 
                const sourceClasses = Object.entries(classesObj || {}).filter(([id, c]) => c.termId === sourceTermId);
                
                if (sourceClasses.length === 0) {
                    app.hideLoading();
                    return Swal.fire({ icon: 'warning', title: 'ไม่พบข้อมูล', text: 'เทอมต้นทางที่เลือกไม่มีข้อมูลชั้นเรียนเลย', confirmButtonColor: '#F52746' });
                }

                const updates = {};
                let classCount = 0;
                let studentCount = 0;

                for (const [oldClassId, cls] of sourceClasses) {
                    const newClassRef = push(ref(db, 'classes'));
                    const newClassId = newClassRef.key;
                    updates[`classes/${newClassId}`] = {
                        level: cls.level,
                        room: cls.room,
                        name: cls.name,
                        termId: app.state.currentTermId
                    };
                    classCount++;

                    const studentsObj = await app.api.get(`students/${oldClassId}`);
                    if (studentsObj) {
                        for (const [oldStudentId, std] of Object.entries(studentsObj)) {
                            const newStudentRef = push(ref(db, `students/${newClassId}`));
                            updates[`students/${newClassId}/${newStudentRef.key}`] = {
                                no: std.no,
                                studentCode: std.studentCode || '',
                                name: std.name
                            };
                            studentCount++;
                        }
                    }
                }

                if (Object.keys(updates).length > 0) {
                    await app.api.update(updates);
                    app.state.cache.classes = null;
                    await app.api.logAction('คัดลอกชั้นเรียน', `คัดลอก ${classCount} ห้อง และนักเรียน ${studentCount} คน จากเทอมอื่นมายังเทอมปัจจุบัน`);
                }
                
                app.hideLoading();
                app.modals.close();
                app.loadAdminTab('admin-classes');
                Swal.fire({ icon: 'success', title: 'คัดลอกข้อมูลสำเร็จ!', html: `นำเข้าข้อมูลชั้นเรียน <b>${classCount} ห้อง</b><br>รายชื่อนักเรียน <b>${studentCount} คน</b>`, confirmButtonColor: '#F52746' });
            },

            // -- Scores --
            saveScores: async (examId, classId, className, maxScore) => {
                const form = document.getElementById('formEditScores');
                const formData = new FormData(form);
                const grader = document.getElementById('graderName').value.trim();
                if(!grader) return app.toast.fire({ icon: 'warning', title: 'กรุณากรอกชื่อผู้ตรวจ' });

                app.showLoading();
                const existingScores = await app.api.get(`scores/${examId}/${classId}`) || {};
                const currentKey = existingScores._metadata?.examKey || 'ว่าง';

                let scoreData = { _metadata: { grader, timestamp: Date.now(), examKey: currentKey } };
                for(let [key, value] of formData.entries()) {
                    if(key.startsWith('score_')) {
                        const sId = key.replace('score_', '');
                        if(value !== '') {
                            let num = parseFloat(value);
                            if(num > maxScore) num = maxScore;
                            scoreData[sId] = num;
                        }
                    }
                }
                const success = await app.api.set(`scores/${examId}/${classId}`, scoreData);
                if(success) {
                    await app.api.logAction('บันทึกคะแนน', `บันทึกคะแนนห้อง ${className} จำนวน ${Object.keys(scoreData).length - 1} คน ผู้ตรวจ: ${grader}`);
                    app.toast.fire({ icon: 'success', title: 'บันทึกคะแนนสำเร็จ' });
                    app.ui.renderAdminClassScores(examId, classId, className, maxScore);
                }
                app.hideLoading();
            },
            autoSaveKey: async (examId, classId, key) => {
                await app.api.set(`scores/${examId}/${classId}/_metadata/examKey`, key);
                app.toast.fire({ icon: 'success', title: `ตั้งค่ารหัสคีย์เป็น ${key}` });

                app.showLoading(); const reader = new FileReader();

                    try {
                        const data = new Uint8Array(e.target.result); const workbook = XLSX.read(data, { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        if (rows.length === 0) { app.hideLoading(); return Swal.fire({ icon: 'warning', title: 'ไฟล์ว่างเปล่า', text: 'กรุณาตรวจสอบว่าไฟล์มีข้อมูลอยู่จริง', confirmButtonColor: '#F52746' }); }

                        const headers = Object.keys(rows[0]);
                        let keyNo = null, keyCode = null, keyName = null, keyClass = null;
                        headers.forEach(h => {
                            const hl = h.toLowerCase().trim();
                            if (hl.includes('เลขที่') || hl === 'no' || hl === 'number') keyNo = h;
                            else if (hl.includes('รหัส') || hl.includes('code') || hl.includes('id')) keyCode = h;
                            else if (hl.includes('ชื่อ') || hl.includes('สกุล') || hl.includes('name') || hl.includes('นักเรียน')) keyName = h;
                            else if (hl.includes('ระดับชั้น') || hl.includes('ชั้น') || hl === 'class' || hl === 'grade') keyClass = h;
                        });

                        if (!keyClass || !keyName) { app.hideLoading(); return Swal.fire({ icon: 'error', title: 'โครงสร้างไฟล์ไม่ถูกต้อง', text: 'จำเป็นต้องมีคอลัมน์ "ระดับชั้น" และ "ชื่อสกุล"', confirmButtonColor: '#F52746' }); }

                        const existingClasses = await app.api.get('classes') || {};
                        const classLookup = {}; 
                        Object.entries(existingClasses).forEach(([cid, c]) => { 
                            if(c.termId === app.state.currentTermId) classLookup[c.name.trim()] = cid; 
                        });

                        const updates = {}; let createdClassesCount = 0; let importedStudentsCount = 0;
                        for (let row of rows) {
                            const rawClassName = String(row[keyClass] || '').trim(); const studentName = String(row[keyName] || '').trim();
                            const no = parseInt(row[keyNo]) || 0; const studentCode = String(row[keyCode] || '').trim();
                            if (!rawClassName || !studentName) continue;

                            let classId = classLookup[rawClassName];
                            if (!classId) {
                                let level = 'ม.1'; let room = '1';
                                if (rawClassName.includes('/')) { const parts = rawClassName.split('/'); level = parts[0].trim(); room = parts[1].trim(); } 
                                else { level = rawClassName.substring(0, 3); room = rawClassName.substring(3).trim() || '1'; }
                                
                                const newClassRef = push(ref(db, 'classes')); classId = newClassRef.key;
                                updates[`classes/${classId}`] = { level: level, room: room, name: rawClassName, termId: app.state.currentTermId };
                                classLookup[rawClassName] = classId; createdClassesCount++;
                            }
                            const newStudentRef = push(ref(db, `students/${classId}`)); const studentId = newStudentRef.key;
                            updates[`students/${classId}/${studentId}`] = { no: no, studentCode: studentCode, name: studentName };
                            importedStudentsCount++;
                        }
                        if (Object.keys(updates).length > 0) {
                            await app.api.update(updates); await app.api.logAction('นำเข้า Excel', `นำเข้าข้อมูล: สร้างชั้นเรียนใหม่ ${createdClassesCount} ห้อง, นักเรียน ${importedStudentsCount} คน`);

                        } else { app.hideLoading(); Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูลที่ต้องนำเข้า', confirmButtonColor: '#F52746' }); }
                    } catch (err) { console.error(err); app.hideLoading(); Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถอ่านไฟล์หรือเขียนข้อมูลได้', confirmButtonColor: '#F52746' }); }

                        </div>
                    </div>
                `;
                document.getElementById('modalContainer').innerHTML = html;
            },
            submitEditTeacher: async (id) => {
                const name = document.getElementById('et-name').value.trim(); if(!name) return;
                app.showLoading(); await app.api.set(`teachers/${id}/name`, name); await app.api.logAction('แก้ไขชื่อครู', `แก้ไขข้อมูลครูรหัส ${id} เป็น ${name}`);
                app.state.cache.teachers = null; app.hideLoading(); app.modals.close(); app.loadAdminTab('admin-teachers'); app.toast.fire({ icon: 'success', title: 'แก้ไขข้อมูลสำเร็จ' });
            },

            // 6. View Deleted Scores 
            openDeletedScores: async (historyId) => {
                app.showLoading(); const historyItem = await app.api.get(`history/${historyId}`);
                if(!historyItem || !historyItem.extraData || !historyItem.extraData.deletedScores) { app.hideLoading(); return app.toast.fire({ icon: 'error', title: 'ไม่พบข้อมูลคะแนนสำรอง' }); }
                const extra = historyItem.extraData; const scoresMap = extra.deletedScores; const cids = Object.keys(scoresMap);
                
                let html = `
                    <div class="fixed inset-0 bg-black bg-opacity-50 z-[100] flex justify-center items-center p-4">
                        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out] flex flex-col max-h-[90vh]">
                            <div class="bg-gray-100 border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                                <div><h3 class="font-bold text-gray-800"><i class="ph ph-clock-counter-clockwise mr-1 text-primary"></i> ข้อมูลคะแนนเดิม</h3><p class="text-xs text-gray-500 mt-1">วิชา: <span class="font-semibold text-gray-700">${extra.subject || '-'}</span></p></div>
                                <button onclick="app.modals.close()" class="text-gray-400"><i class="ph ph-x text-xl"></i></button>
                            </div>
                            <div class="flex border-b border-gray-200 bg-gray-50 overflow-x-auto hide-scroll px-4">
                `;
                for(let i=0; i<cids.length; i++) {
                    const cid = cids[i]; const className = scoresMap[cid]._metadata?.className || extra.className.split(', ')[i] || `รหัส ${cid}`;
                    html += `<button class="backup-tab-btn ${i === 0 ? 'text-primary border-b-2 border-primary font-bold' : 'text-gray-500'} py-3 px-4 text-sm focus:outline-none transition-colors" data-cid="${cid}" onclick="app.ui.switchBackupClassTab('${historyId}', '${cid}')">${className}</button>`;
                }
                html += `</div><div class="p-0 overflow-y-auto flex-1" id="backup-scores-table-container"><div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i></div></div><div class="p-4 border-t border-gray-200 bg-white text-right"><button onclick="app.modals.close()" class="px-6 py-2 bg-gray-100 border border-gray-300 rounded-lg text-sm">ปิด</button></div></div></div>`;
                document.getElementById('modalContainer').innerHTML = html;
                if (cids.length > 0) await app.ui.switchBackupClassTab(historyId, cids[0]);
                app.hideLoading(); 
            },

            // 7. Import Excel 
            openImportExcel: () => {
                const html = `
                    <div class="fixed inset-0 bg-black bg-opacity-50 z-[100] flex justify-center items-center p-4">
                        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                            <div class="bg-primary text-white px-6 py-4 flex justify-between items-center"><h3 class="font-bold text-lg"><i class="ph ph-file-xls mr-2"></i>นำเข้า Excel</h3><button onclick="app.modals.close()"><i class="ph ph-x text-xl"></i></button></div>
                            <div class="p-6 space-y-4">
                                <div class="bg-blue-50 border border-blue-200 text-blue-800 p-4 rounded-lg text-xs space-y-2">
                                    <h4 class="font-bold text-sm">💡 คำแนะนำ:</h4><p>ไฟล์ Excel ต้องมีคอลัมน์: ระดับชั้น, เลขที่, รหัส, ชื่อสกุล</p>
                                    <p class="mt-1 text-primary">ระบบจะเพิ่มข้อมูลเข้าสู่: <b>${app.state.currentTermName}</b></p>
                                </div>
                                <div><input type="file" id="excelFileInput" accept=".xlsx, .xls" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-primary file:text-white cursor-pointer border border-gray-300 rounded-lg p-1"></div>
                                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100"><button type="button" onclick="app.modals.close()" class="px-4 py-2 border rounded-lg text-sm">ยกเลิก</button><button type="button" onclick="app.modals.submitImportExcel()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">เริ่มนำเข้า</button></div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modalContainer').innerHTML = html;
            },
            submitImportExcel: () => {
                const fileInput = document.getElementById('excelFileInput');
                if (fileInput.files.length === 0) return Swal.fire({ icon: 'warning', title: 'ไม่ได้เลือกไฟล์', confirmButtonColor: '#F52746' });
                app.actions.importFromExcel(fileInput.files[0]);
            }
        };

        app.ui.switchBackupClassTab = async (historyId, classId) => {
            document.querySelectorAll('.backup-tab-btn').forEach(btn => {
                if (btn.dataset.cid === classId) { btn.classList.add('text-primary', 'border-b-2', 'border-primary', 'font-bold'); btn.classList.remove('text-gray-500'); } 
                else { btn.classList.remove('text-primary', 'border-b-2', 'border-primary', 'font-bold'); btn.classList.add('text-gray-500'); }
            });
            const container = document.getElementById('backup-scores-table-container');
            container.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i></div>`;

            const historyItem = await app.api.get(`history/${historyId}`);
            if(!historyItem || !historyItem.extraData || !historyItem.extraData.deletedScores) return;
            const scores = historyItem.extraData.deletedScores[classId] || {};
            const studentsObj = await app.api.get(`students/${classId}`);
            const students = studentsObj ? Object.entries(studentsObj).map(([id, s]) => ({id, ...s})).sort((a,b) => parseInt(a.no) - parseInt(b.no)) : [];
            const grader = scores._metadata ? scores._metadata.grader : '-'; const backupDate = scores._metadata?.timestamp ? new Date(scores._metadata.timestamp).toLocaleString('th-TH') : '-';

            let tableHtml = `
                <div class="bg-amber-50 p-3 text-xs text-amber-800 border-b border-amber-100 flex justify-between flex-wrap gap-2"><span>ผู้ตรวจ: <b>${grader}</b></span><span>บันทึกก่อนลบ: <b>${backupDate}</b></span></div>
                <table class="min-w-full divide-y divide-gray-200 text-sm"><thead class="bg-gray-100 sticky top-0"><tr><th class="px-4 py-3 text-center w-16">เลขที่</th><th class="px-4 py-3 text-left">ชื่อ-สกุล</th><th class="px-4 py-3 text-center w-32">คะแนนเดิม</th></tr></thead><tbody class="divide-y divide-gray-100">
            `;
            if(students.length === 0) tableHtml += `<tr><td colspan="3" class="text-center py-6 text-gray-500">ไม่มีรายชื่อนักเรียน</td></tr>`;
            students.forEach(s => {
                const score = scores[s.id] !== undefined ? scores[s.id] : '-'; const isScoreEmpty = score === '-' || score === '';
                tableHtml += `<tr class="hover:bg-gray-50"><td class="px-4 py-2 text-center text-gray-500">${s.no}</td><td class="px-4 py-2 text-gray-700">${s.name}</td><td class="px-4 py-2 text-center font-bold ${isScoreEmpty ? 'text-gray-400' : 'text-gray-800 text-base'}">${isScoreEmpty ? '-' : score}</td></tr>`;
            });
            container.innerHTML = tableHtml + `</tbody></table>`;
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            const style = document.createElement('style');
            style.textContent = `@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }`;
            document.head.appendChild(style);
            
            // รอจนกว่าจะ Init Migration Default Term เสร็จ
            await app.initSystem();
            
            app.navigate('home');
        });

    </script>
</body>
</html>
