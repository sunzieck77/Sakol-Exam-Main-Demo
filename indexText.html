  <script>
// ========== Firebase Init ==========
const firebaseConfig = {
  apiKey: "AIzaSyC9EMq2FPI4Yvory0vitlMcDuFuhnH8Wec",
  authDomain: "sakolexam.firebaseapp.com",
  databaseURL: "https://sakolexam-default-rtdb.firebaseio.com",
  projectId: "sakolexam",
  storageBucket: "sakolexam.firebasestorage.app",
  messagingSenderId: "937822847057",
  appId: "1:937822847057:web:c7ee8bd3a849b6bc973870"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ========== State ==========
let currentPage = 'exams';
let teachers = {};
let exams = {};
let classrooms = {};
let students = {};
let scores = {};
let backups = {};
let currentExamTeacher = null;
let currentExamId = null;
let currentScoreExamItemId = null;
let currentScoreClassName = null;
let isProcessing = false;
let firebaseReady = false;
let filterCompleteOnly = false;
let filterCompleteOnlyViewScores = false;

// Debounce helper
function debounce(fn, delay = 300) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// Prevent rapid clicks
function withLock(fn) {
  return async function(...args) {
    if (isProcessing) return;
    isProcessing = true;
    try { await fn.apply(this, args); }
    finally { setTimeout(() => { isProcessing = false; }, 400); }
  };
}

// ========== Default Classrooms ==========
const defaultClassrooms = {
  'm1_1': { name: 'ม.1/1', level: 'ม.1', order: 1 },
  'm1_2': { name: 'ม.1/2', level: 'ม.1', order: 2 },
  'm1_3': { name: 'ม.1/3', level: 'ม.1', order: 3 },
  'm2_1': { name: 'ม.2/1', level: 'ม.2', order: 4 },
  'm2_2': { name: 'ม.2/2', level: 'ม.2', order: 5 },
  'm2_3': { name: 'ม.2/3', level: 'ม.2', order: 6 },
  'm3_1': { name: 'ม.3/1', level: 'ม.3', order: 7 },
  'm3_2': { name: 'ม.3/2', level: 'ม.3', order: 8 },
  'm3_A': { name: 'ม.3/A', level: 'ม.3 พิเศษ', order: 9 },
  'm3_B': { name: 'ม.3/B', level: 'ม.3 พิเศษ', order: 10 },
  'm3_C': { name: 'ม.3/C', level: 'ม.3 พิเศษ', order: 11 },
  'm4_1': { name: 'ม.4/1', level: 'ม.4', order: 12 },
  'm4_2': { name: 'ม.4/2', level: 'ม.4', order: 13 },
  'm4_3': { name: 'ม.4/3', level: 'ม.4', order: 14 },
  'm5_1': { name: 'ม.5/1', level: 'ม.5', order: 15 },
  'm5_2': { name: 'ม.5/2', level: 'ม.5', order: 16 },
  'm5_3': { name: 'ม.5/3', level: 'ม.5', order: 17 },
  'm6_1': { name: 'ม.6/1', level: 'ม.6', order: 18 },
  'm6_2': { name: 'ม.6/2', level: 'ม.6', order: 19 },
  'm6_3': { name: 'ม.6/3', level: 'ม.6', order: 20 },
  'm6_A': { name: 'ม.6/A', level: 'ม.6 พิเศษ', order: 21 },
  'm6_B': { name: 'ม.6/B', level: 'ม.6 พิเศษ', order: 22 },
  'm6_C': { name: 'ม.6/C', level: 'ม.6 พิเศษ', order: 23 }
};

// ========== Firebase Listeners ==========
function initFirebaseListeners() {
  db.ref('teachers').on('value', snap => {
    teachers = snap.val() || {};
    if (currentPage === 'teachers') renderTeachers();
    if (currentPage === 'exams') renderExams();
    if (currentPage === 'viewScores') renderViewScoresPage();
  });
  db.ref('exams').on('value', snap => {
    exams = snap.val() || {};
    if (currentPage === 'exams') renderExams();
    if (currentPage === 'viewScores') renderViewScoresPage();
  });
  db.ref('classrooms').on('value', snap => {
    const data = snap.val();
    if (!data) {
      db.ref('classrooms').set(defaultClassrooms);
    } else {
      classrooms = data;
      if (currentPage === 'classrooms') renderClassrooms();
      if (currentPage === 'viewScores') renderViewScoresPage();
    }
  });
  db.ref('students').on('value', snap => {
    students = snap.val() || {};
  });
  db.ref('scores').on('value', snap => {
    scores = snap.val() || {};
  });
  db.ref('backups').on('value', snap => {
    backups = snap.val() || {};
    if (currentPage === 'backup') renderBackups();
    cleanOldBackups();
  });
  firebaseReady = true;
}

function cleanOldBackups() {
  const now = Date.now();
  const sevenDays = 7 * 24 * 60 * 60 * 1000;
  Object.entries(backups).forEach(([id, b]) => {
    if (b.createdAt && (now - b.createdAt) > sevenDays) {
      db.ref('backups/' + id).remove();
    }
  });
}

// ========== Navigation ==========
function navigateViewScores() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('viewScoresScreen').style.display = 'flex';
  currentPage = 'viewScores';
  filterCompleteOnlyViewScores = false;
  document.getElementById('filterLabelViewScores').textContent = 'ทั้งหมด';
  initFirebaseListeners();
}

function enterApp() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  initFirebaseListeners();
}

function backToWelcome() {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('viewScoresScreen').style.display = 'none';
  document.getElementById('welcomeScreen').style.display = 'flex';
  currentPage = 'exams';
  filterCompleteOnly = false;
  filterCompleteOnlyViewScores = false;
}

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) { target.classList.add('active'); target.classList.add('fade-in'); }
  
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active-nav');
    n.classList.add('text-textSub');
  });
  const activeNav = document.querySelector(`[data-nav="${page}"]`);
  if (activeNav) { activeNav.classList.add('active-nav'); activeNav.classList.remove('text-textSub'); }

  if (page === 'exams') { filterCompleteOnly = false; document.getElementById('filterLabelExams').textContent = 'ทั้งหมด'; renderExams(); }
  if (page === 'classrooms') renderClassrooms();
  if (page === 'teachers') renderTeachers();
  if (page === 'backup') renderBackups();
}

function toggleMobileMenu() {
  document.getElementById('mobileMenu').classList.toggle('hidden');
}

  const examArr = Object.entries(exams);
  
  if (examArr.length === 0) {

  let html = '';

    let hasMatch = tName.toLowerCase().includes(searchTerm);

// ========== Get Exam Status ==========
function getExamStatus(examId, classList) {
  if (!classList || classList.length === 0) {
    return { label: 'ยังไม่ตรวจ', class: 'not-checked' };
  }

  let checkedCount = 0;
  classList.forEach(cls => {
    const isComplete = checkClassComplete(examId, cls);
    if (isComplete) checkedCount++;
  });

  if (checkedCount === 0) {
    return { label: 'ยังไม่ตรวจ', class: 'not-checked' };
  } else if (checkedCount === classList.length) {
    return { label: 'ตรวจครบแล้ว', class: 'complete' };
  } else {
    return { label: 'ตรวจแล้วบางส่วน', class: 'partial' };
  }
}

function checkClassComplete(examId, cls) {
  const classStudents = Object.entries(students).filter(([_, s]) => s.className === cls);
  if (classStudents.length === 0) return false;
  return classStudents.every(([sid, _]) => {
    return Object.values(scores).some(sc => sc.examId === examId && sc.studentId === sid && sc.className === cls);
  });
}

  // Table
  let tableHtml = '<div class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm">';
  tableHtml += '<thead class="bg-gray-50"><tr><th class="px-3 py-3 text-left w-12">NO</th><th class="px-3 py-3 text-left">ชื่อ</th><th class="px-3 py-3 text-left">สกุล</th><th class="px-3 py-3 text-center font-semibold text-textMain w-20">คะแนน</th></tr></thead><tbody>';
  
  if (classStudentArr.length === 0) {
    tableHtml += '<tr><td colspan="4" class="text-center py-8 text-textSub">ไม่มีนักเรียนในห้องนี้</td></tr>';
  } else {
    classStudentArr.forEach(([sid, st], idx) => {
      const sc = examScores[sid];
      let scoreDisplay = '-';
      let scoreClass = 'text-textSub';
      if (sc) {
        if (sc.score === '-' || sc.score === 'absent') {
          scoreDisplay = 'ขาดสอบ';
          scoreClass = 'text-danger font-medium';
        } else if (sc.score !== undefined && sc.score !== null && sc.score !== '') {
          scoreDisplay = sc.score;
          scoreClass = 'text-textMain font-semibold';
        }
      }
      const bgClass = idx % 2 === 0 ? '' : 'bg-gray-50/50';
      tableHtml += `<tr class="${bgClass} hover:bg-pink-50/30"><td class="px-3 py-2">${st.no || '-'}</td><td class="px-3 py-2">${st.firstName || '-'}</td><td class="px-3 py-2">${st.lastName || '-'}</td><td class="px-3 py-2 text-center ${scoreClass}">${scoreDisplay}</td></tr>`;
    });
  }
  tableHtml += '</tbody></table></div></div>';

  // Footer info
  const examScoreData = Object.values(scores).find(s => s.examId === examId && s.className === currentScoreClassName && s.checkerName);
  const checkerName = examScoreData ? examScoreData.checkerName : '-';
  const savedAt = examScoreData && examScoreData.savedAt ? new Date(examScoreData.savedAt).toLocaleString('th-TH') : '-';

  let footerHtml = `<div class="mt-4 bg-white rounded-xl shadow-sm border border-border p-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
      <div><span class="text-textSub">ผู้ตรวจข้อสอบ:</span> <span class="font-medium text-textMain">${checkerName}</span></div>
      <div><span class="text-textSub">บันทึกเมื่อ:</span> <span class="font-medium text-textMain">${savedAt}</span></div>
    </div>
  </div>`;

  const container_content = topHtml + tabHtml + summaryHtml + tableHtml + footerHtml;
  container.innerHTML = container_content;
}

const performDeleteAllScores = withLock(async function(examId) {

  };

  try {

});

function handleScoreKey(e) {
  if (e.key === 'Tab' || e.key === 'Enter') {
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.score-input'));
    const currentIdx = inputs.indexOf(e.target);
    if (currentIdx < inputs.length - 1) {
      inputs[currentIdx + 1].focus();
      inputs[currentIdx + 1].select();
    }
  }
}

function validateScoreInput(input, max) {
  let val = input.value.trim();
  if (val === '-' || val === '') return;
  // Remove non-numeric except dash
  val = val.replace(/[^0-9.\-]/g, '');
  if (val === '-') { input.value = '-'; return; }
  const num = parseFloat(val);
  if (isNaN(num)) { input.value = ''; return; }
  if (num < 0) { input.value = '0'; return; }
  if (num > max) { input.value = String(max); return; }
  input.value = val;
}

const saveScores = withLock(async function(examId, cls) {

    return;
  }

  // Validate no empty fields
  let hasEmpty = false;
  inputs.forEach(inp => {
    if (inp.value.trim() === '') { hasEmpty = true; inp.style.borderColor = '#EF4444'; }
    else { inp.style.borderColor = ''; }
  });
  if (hasEmpty) {
    Swal.fire({ icon: 'warning', title: 'กรอกคะแนนไม่ครบ', text: 'กรุณากรอกคะแนนนักเรียนทุกคน ใส่ "-" หากขาดสอบ', confirmButtonColor: '#E10043' });

  const updates = {};

  inputs.forEach(inp => {

      examId: examId,
      studentId: sid,
      className: cls,
      score: val === '-' ? '-' : val,
      checkerName: checkerName,
      savedAt: savedAt
    };
  });

  try {
    await db.ref().update(updates);
    closeModal('editScoresModal');
    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });

    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#E10043' });

});

  let classCheckboxes = '';
  Object.entries(levels).forEach(([lv, cls]) => {
    classCheckboxes += `<div class="mb-2"><p class="text-xs font-semibold text-textSub mb-1">${lv}</p><div class="flex flex-wrap gap-2">`;

const saveExam = withLock(async function(examId) {
  const teacherId = document.getElementById('examTeacher').value;
  const subject = document.getElementById('examSubject').value.trim();
  const totalQuestions = document.getElementById('examQuestions').value;
  const selectedClasses = Array.from(document.querySelectorAll('[name="examClass"]:checked')).map(c => c.value);

  if (!teacherId) { Swal.fire({ icon: 'warning', title: 'กรุณาเลือกครูผู้สอน', confirmButtonColor: '#E10043' }); return; }
  if (!subject) { Swal.fire({ icon: 'warning', title: 'กรุณากรอกชื่อรายวิชา', confirmButtonColor: '#E10043' }); return; }
  if (selectedClasses.length === 0) { Swal.fire({ icon: 'warning', title: 'กรุณาเลือกระดับชั้นอย่างน้อย 1 ห้อง', confirmButtonColor: '#E10043' }); return; }
  if (!totalQuestions || parseInt(totalQuestions) <= 0) { Swal.fire({ icon: 'warning', title: 'กรุณากรอกจำนวนข้อสอบ', confirmButtonColor: '#E10043' }); return; }

  const isEdit = examId !== '';
  
  // If editing, check if removed classes have scores
  if (isEdit) {
    const oldClasses = exams[examId].classes || [];
    const removedClasses = oldClasses.filter(c => !selectedClasses.includes(c));
    for (const cls of removedClasses) {
      const hasScoreInClass = Object.values(scores).some(s => s.examId === examId && s.className === cls && s.score !== undefined);
      if (hasScoreInClass) {
        Swal.fire({ icon: 'warning', title: 'ไม่สามารถเอาห้องออกได้', text: `ห้อง ${classrooms[cls]?.name || cls} มีคะแนนอยู่แล้ว กรุณาย้ายคะแนนสำรองก่อน`, confirmButtonColor: '#E10043' });
        return;
      }
    }
  }

  const btn = document.getElementById('saveExamBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ri-loader-5-line ri-sm" style="animation: spin 1s linear infinite;"></i> กำลังบันทึก...';

  const data = { teacherId, subject, totalQuestions: parseInt(totalQuestions), classes: selectedClasses, updatedAt: Date.now() };
  if (!isEdit) data.createdAt = Date.now();

  try {
    if (isEdit) {
      await db.ref('exams/' + examId).update(data);
    } else {
      await db.ref('exams').push(data);
    }
    closeModal('examModal');
    Swal.fire({ icon: 'success', title: isEdit ? 'แก้ไขสำเร็จ' : 'เพิ่มรายการสอบสำเร็จ', timer: 1500, showConfirmButton: false });
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#E10043' });
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-save-2-fill ri-sm"></i> ' + (isEdit ? 'บันทึก' : 'เพิ่มรายการ');
  }
});

      html += `<div class="bg-white rounded-xl shadow-sm border border-border p-3 card-hover cursor-pointer group relative">

const deleteClassroom = withLock(async function(classId) {
  const cl = classrooms[classId];
  if (!cl) return;

  // Check if class has students with scores
  const studentsInClass = Object.entries(students).filter(([_, s]) => s.className === classId);
  
  let hasScores = false;
  for (const [sid, _] of studentsInClass) {
    if (Object.values(scores).some(s => s.studentId === sid)) {
      hasScores = true;
      break;
    }
  }

  if (hasScores) {
    Swal.fire({
      icon: 'warning',
      title: 'ไม่สามารถลบได้',
      text: `ห้อง "${cl.name}" มีนักเรียนที่มีคะแนนสอบแล้ว กรุณาลบคะแนนสอบออกจากรายการสอบก่อน`,
      confirmButtonColor: '#E10043'
    });
    return;
  }

  // Check if class is used in any exam
  const isUsedInExam = Object.values(exams).some(e => (e.classes || []).includes(classId));
  
  let message = `ห้อง "${cl.name}" จะถูกลบถาวร`;
  if (studentsInClass.length > 0) {
    message += ` และนักเรียน ${studentsInClass.length} คน จะถูกลบด้วย`;
  }

  const result = await Swal.fire({
    icon: 'warning',
    title: 'ลบห้องเรียน?',
    text: message,
    showCancelButton: true,
    confirmButtonText: 'ลบ',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#EF4444'
  });

  if (!result.isConfirmed) return;

  try {
    const updates = {};
    updates['classrooms/' + classId] = null;
    
    // Delete students in this class
    studentsInClass.forEach(([sid, _]) => {
      updates['students/' + sid] = null;
    });
    
    await db.ref().update(updates);
    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false });
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#E10043' });
  }
});

      </div>
      <div class="p-4 space-y-3">
        <p class="text-sm text-textSub">ไฟล์ต้องมีคอลัมน์: NO, ID, FirstName, LastName</p>
        <input type="file" id="xlsxFile" accept=".xlsx,.xls" class="w-full text-sm border border-border rounded-lg p-2">
      </div>
      <div class="p-4 border-t border-border flex gap-3 justify-end">
        <button onclick="closeModal('importModal')" class="px-6 py-2 rounded-lg border border-border text-sm font-medium hover:bg-gray-50">ยกเลิก</button>
        <button onclick="importXlsx('${classId}')" id="importBtn" class="btn-primary px-6 py-2 rounded-lg text-sm font-semibold flex items-center gap-2"><i class="ri-download-2-fill ri-sm"></i> นำเข้า</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalsContainer').innerHTML = html;
}

const importXlsx = withLock(async function(classId) {
  const fileInput = document.getElementById('xlsxFile');
  if (!fileInput.files[0]) {
    Swal.fire({ icon: 'warning', title: 'กรุณาเลือกไฟล์', confirmButtonColor: '#E10043' });
    return;
  }

  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ri-loader-5-line ri-sm" style="animation: spin 1s linear infinite;"></i> กำลังนำเข้า...';

  try {
    const data = await fileInput.files[0].arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    if (rows.length === 0) {
      Swal.fire({ icon: 'warning', title: 'ไฟล์ว่างเปล่า', confirmButtonColor: '#E10043' });
      btn.disabled = false;
      btn.innerHTML = '<i class="ri-download-2-fill ri-sm"></i> นำเข้า';
      return;
    }

    const updates = {};
    rows.forEach(row => {
      const key = db.ref('students').push().key;
      updates['students/' + key] = {
        no: parseInt(row['NO'] || row['no'] || row['เลขที่'] || 0),
        studentId: String(row['ID'] || row['id'] || row['รหัส'] || ''),
        firstName: String(row['FirstName'] || row['firstname'] || row['ชื่อ'] || ''),
        lastName: String(row['LastName'] || row['lastname'] || row['สกุล'] || ''),
        className: classId,
        createdAt: Date.now()
      };
    });

    await db.ref().update(updates);
    closeModal('importModal');
    Swal.fire({ icon: 'success', title: `นำเข้า ${rows.length} รายการสำเร็จ`, timer: 2000, showConfirmButton: false });
    setTimeout(() => renderClassStudents(classId), 500);
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#E10043' });
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-download-2-fill ri-sm"></i> นำเข้า';
  }
});

// ========== Backups ==========
function renderBackups() {
  const container = document.getElementById('backupList');
  const arr = Object.entries(backups).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  
  if (arr.length === 0) {
    container.innerHTML = '<div class="text-center py-16"><i class="ri-save-2-fill ri-lg text-5xl mb-3 block text-textSub"></i><p class="text-textSub">ไม่มีข้อมูลสำรอง</p></div>';
    return;
  }

  let html = '';
  arr.forEach(([id, b]) => {
    const createdDate = b.createdAt ? new Date(b.createdAt).toLocaleString('th-TH') : '-';
    const expiryDate = b.createdAt ? new Date(b.createdAt + 7 * 24 * 60 * 60 * 1000).toLocaleString('th-TH') : '-';
    const classNames = (b.classes || []).map(c => classrooms[c]?.name || c).join(', ');
    const scoreCount = b.scores ? Object.keys(b.scores).length : 0;

    html += `<div class="bg-white rounded-xl shadow-sm border border-border p-4 card-hover cursor-pointer group" onclick="viewBackupScores('${id}')">
      <div class="flex items-start justify-between">
        <div class="space-y-1 flex-1">
          <h3 class="font-semibold text-textMain group-hover:text-primary transition-colors">${b.examSubject || 'ไม่ระบุ'}</h3>
          <p class="text-sm text-textSub"><i class="ri-user-2-fill ri-sm"></i> ${b.teacherName || '-'}</p>
          <p class="text-sm text-textSub"><i class="ri-graduation-cap-fill ri-sm"></i> ${classNames || '-'}</p>
          <p class="text-sm text-textSub"><i class="ri-article-fill ri-sm"></i> ${b.totalQuestions || 0} ข้อ | ${scoreCount} คะแนน</p>
          <p class="text-xs text-textSub">สำรอเมื่อ: ${createdDate}</p>
          <p class="text-xs text-warning">หมดอายุ: ${expiryDate}</p>
        </div>
        <button onclick="event.stopPropagation();deleteBackup('${id}')" class="p-2 rounded-lg hover:bg-red-50 text-danger text-sm flex-shrink-0" title="ลบ"><i class="ri-delete-bin-2-fill ri"></i></button>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function viewBackupScores(backupId) {
  const backup = backups[backupId];
  if (!backup) return;

  const scoreMap = {};
  Object.entries(backup.scores || {}).forEach(([key, sc]) => {
    if (!scoreMap[sc.className]) scoreMap[sc.className] = {};
    scoreMap[sc.className][sc.studentId] = sc;
  });

  let html = `<div class="fixed inset-0 modal-overlay z-50 flex items-start justify-center p-4 overflow-auto" id="backupScoresModal">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl my-8 fade-in">
      <div class="p-4 border-b border-border flex items-center justify-between sticky top-0 bg-white rounded-t-2xl z-10">
        <div>
          <h3 class="font-heading text-lg font-bold text-textMain">${backup.examSubject || 'รายการสอบ'}</h3>
          <p class="text-xs text-textSub"><i class="ri-user-2-fill ri-sm"></i> ${backup.teacherName || '-'}</p>
        </div>
        <button onclick="closeModal('backupScoresModal')" class="p-1 rounded hover:bg-gray-100"><i class="ri-close-line ri"></i></button>
      </div>
      <div class="p-4 space-y-6">`;

  Object.entries(scoreMap).forEach(([className, classScores]) => {
    const classItem = classrooms[className];
    const classDisplayName = classItem ? classItem.name : className;
    
    const scoreValues = [];
    let absentCount = 0;
    Object.values(classScores).forEach(sc => {
      if (sc.score === '-' || sc.score === 'absent') {
        absentCount++;
      } else if (sc.score !== undefined && sc.score !== null && sc.score !== '') {
        scoreValues.push(parseFloat(sc.score));
      }
    });
    
    const maxScore = scoreValues.length > 0 ? Math.max(...scoreValues) : '-';
    const minScore = scoreValues.length > 0 ? Math.min(...scoreValues) : '-';
    const avgScore = scoreValues.length > 0 ? (scoreValues.reduce((a, b) => a + b, 0) / scoreValues.length).toFixed(2) : '-';

    html += `<div>
      <h4 class="font-semibold text-textMain mb-2">${classDisplayName}</h4>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
        <div class="bg-green-50 rounded-lg p-2 text-center"><p class="text-xs text-textSub mb-0.5">สูงสุด</p><p class="text-lg font-bold text-success">${maxScore}</p></div>
        <div class="bg-red-50 rounded-lg p-2 text-center"><p class="text-xs text-textSub mb-0.5">ต่ำสุด</p><p class="text-lg font-bold text-danger">${minScore}</p></div>
        <div class="bg-blue-50 rounded-lg p-2 text-center"><p class="text-xs text-textSub mb-0.5">เฉลี่ย</p><p class="text-lg font-bold text-blue-600">${avgScore}</p></div>
        <div class="bg-yellow-50 rounded-lg p-2 text-center"><p class="text-xs text-textSub mb-0.5">ขาดสอบ</p><p class="text-lg font-bold text-warning">${absentCount}</p></div>
      </div>
      <div class="overflow-x-auto border border-border rounded-lg">
        <table class="w-full text-sm">
          <thead class="bg-gray-50"><tr>
            <th class="px-3 py-2 text-left w-12">NO</th>
            <th class="px-3 py-2 text-left">ชื่อ</th>
            <th class="px-3 py-2 text-left">สกุล</th>
            <th class="px-3 py-2 text-center w-20">คะแนน</th>
          </tr></thead>
          <tbody>`;

    const classStudents = Object.entries(students)
      .filter(([_, s]) => s.className === className)
      .sort((a, b) => (parseInt(a[1].no) || 0) - (parseInt(b[1].no) || 0));

    if (classStudents.length === 0) {
      html += '<tr><td colspan="4" class="text-center py-4 text-textSub">ไม่มีข้อมูลนักเรียน</td></tr>';
    } else {
      classStudents.forEach(([sid, st], idx) => {
        const sc = classScores[sid];
        let scoreDisplay = '-';
        let scoreClass = 'text-textSub';
        if (sc) {
          if (sc.score === '-' || sc.score === 'absent') {
            scoreDisplay = 'ขาดสอบ';
            scoreClass = 'text-danger font-medium';
          } else if (sc.score !== undefined && sc.score !== null && sc.score !== '') {
            scoreDisplay = sc.score;
            scoreClass = 'text-textMain font-semibold';
          }
        }
        const bgClass = idx % 2 === 0 ? '' : 'bg-gray-50/50';
        html += `<tr class="${bgClass}"><td class="px-3 py-2">${st.no || '-'}</td><td class="px-3 py-2">${st.firstName || '-'}</td><td class="px-3 py-2">${st.lastName || '-'}</td><td class="px-3 py-2 text-center ${scoreClass}">${scoreDisplay}</td></tr>`;
      });
    }
    html += '</tbody></table></div></div>';
  });

  const firstScore = Object.values(backup.scores || {})[0];
  const checkerName = firstScore ? firstScore.checkerName : '-';

  html += `<div class="mt-4 bg-gray-50 rounded-lg p-3 text-sm">
    <div class="flex flex-wrap gap-4">
      <div><span class="text-textSub">ผู้ตรวจ:</span> <span class="font-medium text-textMain">${checkerName}</span></div>
      <div><span class="text-textSub">สำรอเมื่อ:</span> <span class="font-medium text-textMain">${backup.createdAt ? new Date(backup.createdAt).toLocaleString('th-TH') : '-'}</span></div>
    </div>
  </div>`;

  html += `</div>
      <div class="p-4 border-t border-border flex justify-end">
        <button onclick="closeModal('backupScoresModal')" class="px-6 py-2 rounded-lg border border-border text-sm font-medium hover:bg-gray-50">ปิด</button>
      </div>
    </div>
  </div>`;

  document.getElementById('modalsContainer').innerHTML = html;
}

const deleteBackup = withLock(async function(backupId) {
  const result = await Swal.fire({
    icon: 'warning',
    title: 'ลบข้อมูลสำรอง?',
    text: 'ข้อมูลนี้จะถูกลบถาวรและไม่สามารถถูกกู้คืนได้',
    showCancelButton: true,
    confirmButtonText: 'ลบ',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#EF4444'
  });
  if (!result.isConfirmed) return;

  try {
    await db.ref('backups/' + backupId).remove();
    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false });
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#E10043' });
  }
});

function closeModal(id) {
  const modal = document.getElementById(id);
  if (modal) modal.remove();
  else document.getElementById('modalsContainer').innerHTML = '';
}
