<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>ระบบจัดการสอบ - โรงเรียนสกลวิทยา</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F52746',
                        'primary-dark': '#d41f3a',
                        'primary-light': '#f85a73',

                    },

                        'xxs': '10px',

            }

    </script>

    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SheetJS (XLSX Parsing Library) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Marked.js (Markdown Parser for AI output) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; color: #111827; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border-top-color: #F52746; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Skeleton Animation */
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Custom Scrollbar for tables */
        .table-container::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* AI Markdown Styling */
        .ai-content h1 { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #1f2937; border-left: 4px solid #F52746; padding-left: 8px; }
        .ai-content h2 { font-size: 1.1rem; font-weight: bold; margin-top: 0.8rem; margin-bottom: 0.4rem; color: #374151; }
        .ai-content p { margin-bottom: 0.75rem; line-height: 1.6; color: #4b5563; }
        .ai-content ul { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .ai-content li { margin-bottom: 0.25rem; color: #4b5563; }
        .ai-content strong { color: #111827; font-weight: 600; }
        .ai-content blockquote { border-left: 4px solid #cbd5e1; padding-left: 12px; font-style: italic; color: #6b7280; margin: 1rem 0; }
    </style>
</head>
<body class="text-sm md:text-base">

    <!-- Navbar -->
    <nav class="glass-header sticky top-0 z-50 border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="app.navigate('home')">
                    <img class="h-10 w-auto rounded-md shadow-sm" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVcb4_iotfwEJf9W6CNhIqY-MJkwz0NC6xH8PiXoy2qQuBQoszEcMZpnE&s=10" alt="โรงเรียนสกลวิทยา">
                    <div class="ml-3 flex flex-col">
                        <span class="font-bold text-lg leading-tight text-gray-900">โรงเรียนสกลวิทยา</span>
                        <span class="text-xs text-primary font-semibold">ระบบจัดการสอบ</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="navAdminBtn" class="p-2 text-gray-500 hover:text-primary transition-colors rounded-full hover:bg-red-50" onclick="app.promptAdminLogin()">
                        <i class="ph ph-gear text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Top Navigation Bar (Back Button & Breadcrumbs) -->
    <div id="topNavContainer" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 hidden flex-col sm:flex-row sm:items-center gap-3 md:gap-4">
        <button id="globalBackBtn" onclick="app.goBack()" class="flex items-center justify-center text-sm text-gray-700 hover:text-primary transition bg-white border border-gray-300 px-3 py-1.5 rounded-lg shadow-sm hover:bg-gray-50">
            <i class="ph ph-arrow-left mr-1.5 text-lg"></i> ย้อนกลับ
        </button>
        <nav class="flex text-xs md:text-sm text-gray-500 font-medium overflow-x-auto hide-scroll" aria-label="Breadcrumb" id="breadcrumbList">
            <!-- Dynamic Breadcrumbs -->
        </nav>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-24" id="mainContent">
        <!-- Content will be injected here -->
    </main>

    <!-- Global Modals Container -->
    <div id="modalContainer"></div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCG5jdaYdcKeAe0yVBB-IOcPaWqMF6Ioa4",
            authDomain: "sakol-exam-demo.firebaseapp.com",
            databaseURL: "https://sakol-exam-demo-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sakol-exam-demo",
            storageBucket: "sakol-exam-demo.firebasestorage.app",
            messagingSenderId: "762406440249",
            appId: "1:762406440249:web:a2aef8217dcd31094dece8"
        };

        // Initialize Firebase
        const firebaseApp = initializeApp(firebaseConfig);
        const db = getDatabase(firebaseApp);

        // ==========================================
        // SYSTEM CORE & STATE MANAGEMENT
        // ==========================================
        window.app = {
            db: db,
            state: {
                isAdmin: false,
                currentView: 'home',
                breadcrumbs: [{ label: 'หน้าแรก', view: 'home' }],
                history: [], // Stack สำหรับการกดย้อนกลับ
                cache: { teachers: null, classes: null }, // Simple memory cache
                pagination: { page: 1, limit: 12 },
                tempData: {}, // For passing data between views
                searchQuery: "", // สำหรับตัวค้นหา
                statusFilter: "all", // ตัวกรองสถานะ (all, graded, partial, ungraded)
                isTodayFilter: false, // ตัวกรองวันสอบเฉพาะวันนี้ (Admin Exams Tab)
                
                // Admin Advanced Filters
                adminFilterDropdownOpen: false,
                adminFilterHasExams: false,
                adminFilterHasScores: false,
                adminFilterAllGraded: false,
                
                searchTimeout: null // สำหรับ Debounce ป้องกันพิมพ์แล้วรีเฟรชถี่
            },

            // --- Utilities ---
            toast: Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
                timerProgressBar: true, didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            }),

            showLoading: () => {
                Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, showConfirmButton: false, 
                    willOpen: () => { Swal.showLoading(); } 
                });
            },
            hideLoading: () => { Swal.close(); },

            // Security: Obfuscated password check ("skexam")
            checkPwd: (p) => p === atob('c2tleGFt'),

            // --- Database Helpers (Lazy Fetching) ---
            api: {
                get: async (path, force = false) => {
                    if (!force && app.state.cache[path]) return app.state.cache[path];
                    try {
                        const snapshot = await get(child(ref(db), path));
                        const data = snapshot.exists() ? snapshot.val() : null;
                        if(path === 'teachers' || path === 'classes') app.state.cache[path] = data;
                        return data;
                    } catch (e) {
                        console.error(e);
                        app.toast.fire({ icon: 'error', title: 'เกิดข้อผิดพลาดในการดึงข้อมูล' });
                        return null;
                    }
                },
                set: async (path, data) => {
                    try { await set(ref(db, path), data); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                update: async (updates) => {
                    try { await update(ref(db), updates); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                remove: async (path) => {
                    try { await remove(ref(db, path)); return true; } 
                    catch (e) { console.error(e); return false; }
                },
                push: async (path, data) => {
                    try { 
                        const newRef = push(ref(db, path));
                        await set(newRef, data); 
                        return newRef.key;
                    } catch (e) { console.error(e); return null; }
                },
                logAction: async (action, details, refId = "", extraData = null) => {
                    if(!app.state.isAdmin) return;
                    await app.api.push('history', {
                        action, details, refId, extraData, timestamp: Date.now()
                    });
                },

                // --- INTEGRATION: Gemini LLM API Call with Exponential Backoff ---
                callGemini: async (contents, systemInstruction = "") => {
                    const apiKey = ""; // supplied at runtime
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: contents
                    };
                    if (systemInstruction) {
                        payload.systemInstruction = {
                            parts: [{ text: systemInstruction }]
                        };
                    }

                    const delays = [1000, 2000, 4000, 8000, 16000];
                    for (let i = 0; i <= delays.length; i++) {
                        try {
                            const response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            const result = await response.json();
                            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        } catch (error) {
                            if (i === delays.length) {
                                throw error; // All retries failed
                            }
                            await new Promise(resolve => setTimeout(resolve, delays[i]));
                        }
                    }
                }
            },

            // --- Search Debounce Handler ---
            handleSearch: (val, actionObj) => {
                app.state.searchQuery = val;
                app.state.pagination.page = 1;
                
                clearTimeout(app.state.searchTimeout);
                app.state.searchTimeout = setTimeout(() => {
                    if (actionObj.type === 'renderView') {
                        app.renderView(true); // true = skip skeleton to prevent jumping
                    } else if (actionObj.type === 'loadAdminTab') {
                        app.loadAdminTab(actionObj.tab, true);
                    }
                }, 400); // รอผู้ใช้หยุดพิมพ์ 400ms ก่อนรีเฟรชข้อมูล
            },

            // --- Navigation & Rendering ---
            navigate: (view, params = {}, isBack = false) => {
                // บันทึกประวัติเพื่อปุ่มย้อนกลับ
                if (!isBack && app.state.currentView && app.state.currentView !== view) {
                    app.state.history.push({
                        view: app.state.currentView,
                        params: JSON.parse(JSON.stringify(app.state.tempData)),
                        searchQuery: app.state.searchQuery,
                        statusFilter: app.state.statusFilter,
                        isTodayFilter: app.state.isTodayFilter,
                        
                        adminFilterHasExams: app.state.adminFilterHasExams,
                        adminFilterHasScores: app.state.adminFilterHasScores,
                        adminFilterAllGraded: app.state.adminFilterAllGraded,

                        page: app.state.pagination.page
                    });
                }

                app.state.currentView = view;
                app.state.tempData = params;
                
                // รีเซ็ตค่าการค้นหาและหน้าเมื่อไปยังหน้าใหม่ (ถ้าไม่ใช่การย้อนกลับ)
                if (!isBack) {
                    app.state.pagination.page = 1;
                    app.state.searchQuery = "";
                    app.state.statusFilter = "all";
                    app.state.isTodayFilter = false;
                    
                    app.state.adminFilterDropdownOpen = false;
                    app.state.adminFilterHasExams = false;
                    app.state.adminFilterHasScores = false;
                    app.state.adminFilterAllGraded = false;
                }
                
                // Update Top Navbar Visibility (Back Button)
                const tnc = document.getElementById('topNavContainer');
                if (view === 'home') {
                    app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }];
                    tnc.classList.add('hidden');
                    tnc.classList.remove('flex');
                    app.state.history = []; // ล้างประวัติเมื่ออยู่หน้าแรก
                } else {
                    tnc.classList.remove('hidden');
                    tnc.classList.add('flex');
                    
                    // สร้าง Breadcrumbs ตาม View
                    if(view === 'public-teachers') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'รายชื่อครูผู้สอน', view: 'public-teachers' }
                        ];
                    }
                    if(view === 'public-exams') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'รายชื่อครูผู้สอน', view: 'public-teachers' }, 
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'public-exams', params: params }
                        ];
                    }
                    if(view === 'public-exam-scores') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' },
                            { label: 'รายชื่อครูผู้สอน', view: 'public-teachers' },
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'public-exams', params: { teacherId: params.teacherId, teacherName: params.teacherName } },
                            { label: params.examSubject, view: 'public-exam-scores', params: params }
                        ];
                    }
                    if(view === 'admin-dashboard') {
                        app.state.breadcrumbs = [{ label: 'หน้าแรก', view: 'home' }, { label: 'จัดการระบบ', view: 'admin-dashboard' }];
                    }
                    if(view === 'admin-teacher-exams') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `รายการสอบของ ${params.teacherName}`, view: 'admin-teacher-exams', params }
                        ];
                    }
                    if(view === 'admin-manage-scores') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `รายการสอบของ ${params.teacherName || ''}`, view: 'admin-teacher-exams', params: { teacherId: params.teacherId, teacherName: params.teacherName } },
                            { label: `จัดการคะแนน ${params.subjectName}`, view: 'admin-manage-scores', params }
                        ];
                    }
                    if(view === 'admin-class-students') {
                        app.state.breadcrumbs = [
                            { label: 'หน้าแรก', view: 'home' }, 
                            { label: 'จัดการระบบ', view: 'admin-dashboard' },
                            { label: `นักเรียนชั้น ${params.className}`, view: 'admin-class-students', params }
                        ];
                    }
                }
                app.renderBreadcrumbs();
                app.renderView();
            },

            // ระบบย้อนกลับ
            goBack: () => {
                if (app.state.history.length > 0) {
                    const prev = app.state.history.pop();
                    app.state.searchQuery = prev.searchQuery;
                    app.state.statusFilter = prev.statusFilter;
                    app.state.isTodayFilter = prev.isTodayFilter;
                    
                    app.state.adminFilterHasExams = prev.adminFilterHasExams || false;
                    app.state.adminFilterHasScores = prev.adminFilterHasScores || false;
                    app.state.adminFilterAllGraded = prev.adminFilterAllGraded || false;

                    app.state.pagination.page = prev.page || 1;
                    app.navigate(prev.view, prev.params, true);
                } else {
                    app.navigate('home', {}, true);
                }
            },

            renderBreadcrumbs: () => {
                const list = document.getElementById('breadcrumbList');
                list.innerHTML = app.state.breadcrumbs.map((b, i) => {
                    const isLast = i === app.state.breadcrumbs.length - 1;
                    const paramsStr = b.params ? JSON.stringify(b.params).replace(/"/g, '&quot;') : '{}';
                    return `
                        <div class="flex items-center space-x-1.5 whitespace-nowrap">
                            ${i > 0 ? '<i class="ph ph-caret-right text-gray-400"></i>' : ''}
                            <a href="#" onclick="app.navigate('${b.view}', ${paramsStr})" 
                               class="${isLast ? 'text-gray-800 font-semibold cursor-default pointer-events-none' : 'hover:text-primary transition'}">
                               ${b.label}
                            </a>
                        </div>
                    `;
                }).join('');
            },

            renderView: async (skipLoading = false) => {
                let focusData = null;
                // รักษาเคอร์เซอร์โฟกัสหากกำลังค้นหา
                if (skipLoading) {
                    const active = document.activeElement;
                    if(active && active.id && active.tagName === 'INPUT') {
                        try { focusData = { id: active.id, start: active.selectionStart, end: active.selectionEnd }; } catch(e){}
                    }
                }

                const container = document.getElementById('mainContent');
                if (!skipLoading) container.innerHTML = app.components.skeletonFull(); 

                const views = {
                    'home': app.views.home,
                    'public-teachers': app.views.publicTeachers,
                    'public-exams': app.views.publicExams,
                    'public-exam-scores': app.views.publicExamScores,
                    'admin-dashboard': app.views.adminDashboard,
                    'admin-teacher-exams': app.views.adminTeacherExams,
                    'admin-manage-scores': app.views.adminManageScores,
                    'admin-class-students': app.views.adminClassStudents
                };

                if (views[app.state.currentView]) {
                    const html = await views[app.state.currentView]();
                    container.innerHTML = html;
                    if(app.state.currentView === 'admin-dashboard') app.initAdminTabs();
                } else {
                    container.innerHTML = `<div class="text-center py-20 text-gray-500">ไม่พบหน้าที่ต้องการ</div>`;
                }
                
                const adminBtn = document.getElementById('navAdminBtn');
                if(app.state.isAdmin) {
                    adminBtn.classList.add('text-primary', 'bg-red-50');
                    adminBtn.classList.remove('text-gray-500');
                } else {
                    adminBtn.classList.remove('text-primary', 'bg-red-50');
                    adminBtn.classList.add('text-gray-500');
                }

                // คืนค่าตำแหน่งการกะพริบเคอร์เซอร์
                if (focusData) {
                    const el = document.getElementById(focusData.id);
                    if (el) {
                        el.focus();
                        try { el.setSelectionRange(focusData.start, focusData.end); } catch(e){}
                    }
                }
            },

            // --- Authentication ---
            promptAdminLogin: () => {
                if (app.state.isAdmin) {
                    app.navigate('admin-dashboard');
                    return;
                }

                Swal.fire({
                    title: 'สำหรับผู้ดูแลระบบ',
                    input: 'password',
                    inputPlaceholder: 'กรอกรหัสผ่าน',
                    showCancelButton: true,
                    confirmButtonColor: '#F52746',
                    confirmButtonText: 'เข้าสู่ระบบ',
                    cancelButtonText: 'ยกเลิก'
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (app.checkPwd(result.value)) {
                            app.state.isAdmin = true;
                            app.toast.fire({ icon: 'success', title: 'เข้าสู่ระบบผู้ดูแลสำเร็จ' });
                            app.navigate('admin-dashboard');
                        } else {
                            Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง', confirmButtonColor: '#F52746' });
                        }
                    }
                });
            },

            // --- Pagination Helper ---
            paginate: (array) => {
                const start = (app.state.pagination.page - 1) * app.state.pagination.limit;
                const end = start + app.state.pagination.limit;
                return array.slice(start, end);
            },
            renderPagination: (totalItems, actionStr = "app.renderView()") => {
                const totalPages = Math.ceil(totalItems / app.state.pagination.limit);
                if (totalPages <= 1) return '';
                
                const currentPage = app.state.pagination.page;
                
                let btns = '';
                
                const prevDisabled = currentPage === 1;
                btns += `
                    <button onclick="${prevDisabled ? '' : `app.state.pagination.page = ${currentPage - 1}; ${actionStr};`}" 
                            class="px-3 py-1 border rounded-md text-sm font-medium transition ${prevDisabled ? 'text-gray-300 border-gray-200 cursor-not-allowed bg-gray-50' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">
                        ก่อนหน้า
                    </button>
                `;

                for(let i=1; i<=totalPages; i++) {
                    const active = i === currentPage ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-300';
                    btns += `<button onclick="app.state.pagination.page = ${i}; ${actionStr};" class="hidden sm:inline-block px-3 py-1 border rounded-md text-sm ${active}">${i}</button>`;
                }
                
                btns += `<span class="sm:hidden px-3 py-1 text-sm text-gray-500">หน้า ${currentPage}/${totalPages}</span>`;

                const nextDisabled = currentPage === totalPages;
                btns += `
                    <button onclick="${nextDisabled ? '' : `app.state.pagination.page = ${currentPage + 1}; ${actionStr};`}" 
                            class="px-3 py-1 border rounded-md text-sm font-medium transition ${nextDisabled ? 'text-gray-300 border-gray-200 cursor-not-allowed bg-gray-50' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'}">
                        ถัดไป
                    </button>
                `;

                return `<div class="flex justify-center items-center space-x-2 mt-6">${btns}</div>`;
            },

            // คำนวณสถานะการตรวจวิชาสอบ
            calculateExamStatus: async (examId, classesObj) => {
                const classIds = Object.keys(classesObj || {});
                if(classIds.length === 0) return { text: "ยังไม่ตรวจ", color: "bg-gray-100 text-gray-600 border-gray-200" };

                let gradedCount = 0;

        app.loadAdminTab = async (tabName, skipLoading = false) => {
            const container = document.getElementById('adminTabContent');
            
            let focusData = null;
            if (skipLoading) {
                const active = document.activeElement;
                if(active && active.id && active.tagName === 'INPUT') {
                    try { focusData = { id: active.id, start: active.selectionStart, end: active.selectionEnd }; } catch(e){}
                }
            }

            if (!skipLoading) {
                container.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i></div>`;
            }
            
            if(tabName === 'admin-exams') container.innerHTML = await app.adminTabs.exams();
            if(tabName === 'admin-schedules') container.innerHTML = await app.adminTabs.schedules();
            if(tabName === 'admin-classes') container.innerHTML = await app.adminTabs.classes();
            if(tabName === 'admin-teachers') container.innerHTML = await app.adminTabs.teachers();
            if(tabName === 'admin-history') container.innerHTML = await app.adminTabs.history();

            // คืนค่าเคอร์เซอร์หลังการสลับ DOM
            if (focusData) {
                const el = document.getElementById(focusData.id);
                if (el) {
                    el.focus();
                    try { el.setSelectionRange(focusData.start, focusData.end); } catch(e){}
                }

                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

                if (app.state.isTodayFilter) {
                    const todayExamIds = new Set(schedules.filter(s => s.date === todayStr).map(s => s.examId));

                // --- NEW: Calculate Teacher Stats for Filters ---

                    const classIds = Object.keys(classesObj || {});
                    if (classIds.length === 0) return "ยังไม่ตรวจ";
                    let gradedCount = 0;
                    for (const cid of classIds) {
                        const scoreData = allScores[examId] ? allScores[examId][cid] : null;
                        if (scoreData && scoreData._metadata && Object.keys(scoreData).length > 1) {
                            gradedCount++;
                        }
                    }
                    if (gradedCount === 0) return "ยังไม่ตรวจ";
                    else if (gradedCount < classIds.length) return "บางส่วน";
                    else return "ตรวจแล้ว";
                };

                const teacherStats = {};
                for (let t of teachers) {
                    const tExams = exams.filter(e => e.teacherId === t.id);
                    if (tExams.length === 0) {
                        teacherStats[t.id] = { hasExams: false, hasScores: false, allGraded: false };
                        continue;
                    }
                    let anyGraded = false;
                    let allExamsGraded = true;
                    for (let e of tExams) {
                        const statusText = getExamStatusSync(e.id, e.classes);
                        if (statusText !== "ยังไม่ตรวจ") anyGraded = true;
                        if (statusText !== "ตรวจแล้ว") allExamsGraded = false;
                    }
                    teacherStats[t.id] = { hasExams: true, hasScores: anyGraded, allGraded: allExamsGraded };
                }

                // --- Apply New Checkbox Filters ---
                if (app.state.adminFilterHasExams) {
                    teachers = teachers.filter(t => teacherStats[t.id].hasExams);
                }
                if (app.state.adminFilterHasScores) {
                    teachers = teachers.filter(t => teacherStats[t.id].hasScores);
                }

                        const teacherExams = exams.filter(e => e.teacherId === t.id);

                        return matchName || matchSubject;

                                       onchange="app.state.isTodayFilter = this.checked; app.state.pagination.page = 1; app.loadAdminTab('admin-exams', true);"

                                <input type="text" id="adminTabExamsSearch" placeholder="ค้นหาชื่อครู หรือ ชื่อวิชาสอบ..." value="${app.state.searchQuery}" 
                                       oninput="app.handleSearch(this.value, {type: 'loadAdminTab', tab: 'admin-exams'})"

                                        <input type="checkbox" onchange="app.state.adminFilterAllGraded = this.checked; app.state.adminFilterDropdownOpen = true; app.state.pagination.page = 1; app.loadAdminTab('admin-exams', true);" ${app.state.adminFilterAllGraded ? 'checked' : ''} class="mt-0.5 rounded text-primary focus:ring-primary w-4 h-4">
                                        <span class="text-sm text-gray-700 group-hover:text-primary transition leading-tight">คะแนนครบหมดแล้ว</span>
                                    </label>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                `;

                if(teachers.length === 0) html += `<div class="col-span-full">${app.components.emptyState('ไม่พบข้อมูลการค้นหา หรือตัวกรอง')}</div>`;

                app.paginate(teachers).forEach(t => {
                    // สร้าง Label ย่อยๆ เพื่อบอกว่าครูคนนี้ผ่านเงื่อนไขใดบ้าง (Optional visual cue)
                    let badges = '';
                    if (teacherStats[t.id]) {
                         if(teacherStats[t.id].allGraded && teacherStats[t.id].hasExams) badges = `<span class="px-2 py-0.5 bg-green-50 text-green-600 border border-green-100 rounded text-[10px] font-semibold">ตรวจครบ</span>`;
                         else if(teacherStats[t.id].hasScores) badges = `<span class="px-2 py-0.5 bg-amber-50 text-amber-600 border border-amber-100 rounded text-[10px] font-semibold">เริ่มตรวจแล้ว</span>`;

                            </div>
                            <div class="flex justify-start ml-9">
                                ${badges}
                            </div>

                });
                html += `</div>` + app.renderPagination(teachers.length, "app.loadAdminTab('admin-exams')");
                return html;

            schedules: async () => {

                    app.api.get('schedules'), app.api.get('exams'), app.api.get('teachers')
                ]);
                let schedules = schedulesObj ? Object.entries(schedulesObj).map(([id, s]) => ({id, ...s})) : [];
                const exams = examsObj || {};

                    s.subject = ex ? ex.subject : 'ไม่พบข้อมูลวิชา (อาจถูกลบ)';
                    s.teacherName = ex && teachers[ex.teacherId] ? teachers[ex.teacherId].name : '-';
                });

                const searchQ = app.state.searchQuery.toLowerCase().trim();

                schedules.sort((a, b) => {

                let html = `

                            <i class="ph ph-caret-down"></i>

                    <div id="${containerId}-list" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg z-50 divide-y divide-gray-100">
                    </div>
                </div>
            `;

            container.dataset.items = JSON.stringify(items);
            app.ui.renderDropdownListItems(containerId, hiddenInputId, items);

            const closeDropdown = (e) => {
                if (!container || !container.isConnected) {
                    document.removeEventListener('click', closeDropdown);
                    return;
                }
                if (!container.contains(e.target)) {
                    const list = document.getElementById(`${containerId}-list`);
                    if (list) list.classList.add('hidden');
                    
                    const searchInput = document.getElementById(`${containerId}-search`);
                    const hiddenInput = document.getElementById(hiddenInputId);
                    if (searchInput && hiddenInput) {
                        const currentItems = JSON.parse(container.dataset.items || '[]');
                        const selectedItem = currentItems.find(i => i.id === hiddenInput.value);
                        if (selectedItem) {
                            searchInput.value = selectedItem.name;
                        } else {
                            searchInput.value = '';
                            hiddenInput.value = '';
                        }
                    }
                }
            };
            
            // Cleanup old listener if it exists to prevent multiple bindings
            if (window[`_clickOutsideHandler_${containerId}`]) {
                document.removeEventListener('click', window[`_clickOutsideHandler_${containerId}`]);
            }
            window[`_clickOutsideHandler_${containerId}`] = closeDropdown;
            document.addEventListener('click', closeDropdown);
        };

                listContainer.innerHTML = `<div class="p-3 text-xs text-gray-500 text-center">ไม่พบข้อมูลในระบบ</div>`;

            saveScores: async (examId, classId, className, maxScore) => {
                const form = document.getElementById('formEditScores');
                const formData = new FormData(form);
                const grader = document.getElementById('graderName').value.trim();
                
                if(!grader) return app.toast.fire({ icon: 'warning', title: 'กรุณากรอกชื่อผู้ตรวจ' });

                app.showLoading();
                
                // Get existing metadata for examKey preservation
                const existingScores = await app.api.get(`scores/${examId}/${classId}`) || {};
                const currentKey = existingScores._metadata?.examKey || 'ว่าง';

                let scoreData = {
                    _metadata: { grader, timestamp: Date.now(), examKey: currentKey }
                };

                for(let [key, value] of formData.entries()) {
                    if(key.startsWith('score_')) {
                        const sId = key.replace('score_', '');
                        if(value !== '') {
                            let num = parseFloat(value);
                            if(num > maxScore) num = maxScore;
                            scoreData[sId] = num;
                        }
                    }
                }

                const success = await app.api.set(`scores/${examId}/${classId}`, scoreData);
                if(success) {
                    await app.api.logAction('บันทึกคะแนน', `บันทึกคะแนนห้อง ${className} จำนวน ${Object.keys(scoreData).length - 1} คน ผู้ตรวจ: ${grader}`);

                            const scoreData = await app.api.get(`scores/${examId}/${cid}`);
                            if (scoreData) {
                                scoresBackup[cid] = scoreData;
                            }
                        }

                        const updates = {};
                        updates[`exams/${examId}`] = null;
                        for (let cid of classIds) {
                            updates[`scores/${examId}/${cid}`] = null;
                        }
                        
                        await app.api.update(updates);
                        
                        await app.api.logAction(
                            'ลบวิชาสอบ', 
                            `ลบวิชาสอบ ${exam.subject} ออกจากระบบ (ครูผู้สอน: ${teacherName})`, 
                            "", 
                            {
                                deletedScores: scoresBackup,
                                className: classIds.map(cid => exam.classes[cid]).join(', '),
                                subject: exam.subject,
                                classId: classIds.join(',') 
                            }
                        );

                        app.hideLoading();
                        app.toast.fire({ icon: 'success', title: 'ลบวิชาสอบเรียบร้อยแล้ว' });
                        app.renderView(); 
                    }
                });
            },

            // -- Smart Excel Import Engine --
            importFromExcel: async (file) => {
                app.showLoading();
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet);

                        if (rows.length === 0) {
                            app.hideLoading();
                            return Swal.fire({ icon: 'warning', title: 'ไฟล์ว่างเปล่า', text: 'กรุณาตรวจสอบว่าไฟล์มีข้อมูลอยู่จริง', confirmButtonColor: '#F52746' });
                        }

                        const firstRow = rows[0];
                        const headers = Object.keys(firstRow);
                        
                        let keyNo = null, keyCode = null, keyName = null, keyClass = null;

                        headers.forEach(h => {
                            const hl = h.toLowerCase().trim();
                            if (hl.includes('เลขที่') || hl === 'no' || hl === 'number') keyNo = h;
                            else if (hl.includes('รหัส') || hl.includes('code') || hl.includes('id')) keyCode = h;
                            else if (hl.includes('ชื่อ') || hl.includes('สกุล') || hl.includes('name') || hl.includes('นักเรียน')) keyName = h;
                            else if (hl.includes('ระดับชั้น') || hl.includes('ชั้น') || hl === 'class' || hl === 'grade') keyClass = h;
                        });

                        if (!keyClass || !keyName) {
                            app.hideLoading();
                            return Swal.fire({
                                icon: 'error',
                                title: 'โครงสร้างไฟล์ไม่ถูกต้อง',
                                text: 'จำเป็นต้องมีคอลัมน์ชื่อ "ระดับชั้น" (เพื่อแบ่งห้อง) และ "ชื่อสกุล/ชื่อ"',
                                confirmButtonColor: '#F52746'
                            });
                        }

                        const existingClasses = await app.api.get('classes') || {};
                        const classLookup = {}; 
                        Object.entries(existingClasses).forEach(([cid, c]) => {
                            classLookup[c.name.trim()] = cid;
                        });

                        const updates = {};
                        let createdClassesCount = 0;
                        let importedStudentsCount = 0;

                        for (let row of rows) {
                            const rawClassName = String(row[keyClass] || '').trim();
                            const studentName = String(row[keyName] || '').trim();
                            const no = parseInt(row[keyNo]) || 0;
                            const studentCode = String(row[keyCode] || '').trim();

                            if (!rawClassName || !studentName) continue;

                            let classId = classLookup[rawClassName];
                            if (!classId) {
                                let level = 'ม.1';
                                let room = '1';

                                if (rawClassName.includes('/')) {
                                    const parts = rawClassName.split('/');
                                    level = parts[0].trim();
                                    room = parts[1].trim();
                                } else {
                                    level = rawClassName.substring(0, 3);
                                    room = rawClassName.substring(3).trim() || '1';
                                }

                                const newClassRef = push(ref(db, 'classes'));
                                classId = newClassRef.key;
                                
                                updates[`classes/${classId}`] = {
                                    level: level,
                                    room: room,
                                    name: rawClassName
                                };

                                classLookup[rawClassName] = classId;
                                createdClassesCount++;
                            }

                            const newStudentRef = push(ref(db, `students/${classId}`));
                            const studentId = newStudentRef.key;

                            updates[`students/${classId}/${studentId}`] = {
                                no: no,
                                studentCode: studentCode,
                                name: studentName
                            };
                            importedStudentsCount++;
                        }

                        if (Object.keys(updates).length > 0) {
                            await app.api.update(updates);
                            await app.api.logAction(
                                'นำเข้า Excel', 
                                `นำเข้ารายการจาก Excel: สร้างชั้นเรียนใหม่ ${createdClassesCount} ห้อง, นำเข้านักเรียน ${importedStudentsCount} คน`
                            );

                            app.state.cache.classes = null; 
                            app.hideLoading();
                            app.modals.close();
                            app.loadAdminTab('admin-classes');

                            Swal.fire({
                                icon: 'success',
                                title: 'นำเข้าข้อมูลสำเร็จ!',
                                html: `สร้างชั้นเรียนใหม่: <b>${createdClassesCount} ห้อง</b><br>นำเข้านักเรียนสำเร็จ: <b>${importedStudentsCount} คน</b>`,
                                confirmButtonColor: '#F52746'
                            });
                        } else {
                            app.hideLoading();
                            Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูลที่ต้องนำเข้า', confirmButtonColor: '#F52746' });
                        }

                    } catch (err) {
                        console.error(err);
                        app.hideLoading();
                        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถอ่านไฟล์หรือเขียนข้อมูลลงระบบได้', confirmButtonColor: '#F52746' });
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        };

        // สลับแท็บประวัติข้อมูลคะแนนเดิมที่ลบ
        app.ui.switchBackupClassTab = async (historyId, classId) => {
            document.querySelectorAll('.backup-tab-btn').forEach(btn => {
                if (btn.dataset.cid === classId) {
                    btn.classList.add('text-primary', 'border-b-2', 'border-primary', 'font-bold');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('text-primary', 'border-b-2', 'border-primary', 'font-bold');
                    btn.classList.add('text-gray-500');
                }
            });

            const container = document.getElementById('backup-scores-table-container');
            container.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i></div>`;

            const historyItem = await app.api.get(`history/${historyId}`);
            if(!historyItem || !historyItem.extraData || !historyItem.extraData.deletedScores) return;

            const scores = historyItem.extraData.deletedScores[classId] || {};
            const studentsObj = await app.api.get(`students/${classId}`);
            const students = studentsObj ? Object.entries(studentsObj).map(([id, s]) => ({id, ...s})).sort((a,b) => parseInt(a.no) - parseInt(b.no)) : [];
            const grader = scores._metadata ? scores._metadata.grader : '-';
            const backupDate = scores._metadata?.timestamp ? new Date(scores._metadata.timestamp).toLocaleString('th-TH') : '-';

            let tableHtml = `
                <div class="bg-amber-50 p-3 text-xs text-amber-800 border-b border-amber-100 flex justify-between flex-wrap gap-2">
                    <span>ผู้ตรวจคะแนน: <span class="font-semibold">${grader}</span></span>
                    <span>บันทึกก่อนถูกลบเมื่อ: <span class="font-semibold">${backupDate}</span></span>
                </div>
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-gray-600 w-16">เลขที่</th>
                            <th class="px-4 py-3 text-left text-gray-600">ชื่อ-สกุล</th>
                            <th class="px-4 py-3 text-center text-gray-600 w-32">คะแนนเดิม</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
            `;

            if(students.length === 0) {
                tableHtml += `<tr><td colspan="3" class="text-center py-6 text-gray-500">ไม่มีรายชื่อนักเรียนในห้องเรียนนี้</td></tr>`;
            }

            students.forEach(s => {
                const score = scores[s.id] !== undefined ? scores[s.id] : '-';
                const isScoreEmpty = score === '-' || score === '';
                tableHtml += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 text-center text-gray-500">${s.no}</td>
                        <td class="px-4 py-2 text-gray-700">${s.name}</td>
                        <td class="px-4 py-2 text-center font-bold ${isScoreEmpty ? 'text-gray-400' : 'text-gray-800 text-base'}">${isScoreEmpty ? '-' : score}</td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            container.innerHTML = tableHtml;
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
            `;
            document.head.appendChild(style);
            
            app.navigate('home');
        });

    </script>
</body>
</html>
